/* tile lands / new report flash */
.land{animation:land 1s ease-out}
@keyframes land{0%{box-shadow:0 0 0 2px rgba(255,240,232,.95),0 0 70px rgba(240,138,46,.55)}100%{box-shadow:0 0 0 0 rgba(255,240,232,0),0 0 0 rgba(240,138,46,0)}}
.fresh{animation:freshin 1.6s var(--ease)}
@keyframes freshin{0%{translate:0 -14px;box-shadow:0 0 0 2px #fff,0 0 80px rgba(240,138,46,.85)}100%{translate:0 0;box-shadow:0 0 0 0 rgba(255,255,255,0)}}
@keyframes livedot{0%{box-shadow:0 0 0 0 rgba(240,138,46,.75)}100%{box-shadow:0 0 0 9px rgba(240,138,46,0)}}
.rv .rin{opacity:0}
.rv.on .rin{animation:cin .9s var(--d,.7s) var(--ease) forwards}

/* ---------- aktuelni mesec ---------- */
.phero{width:100%;min-height:clamp(300px,28vw,370px);padding:clamp(24px,3.2vw,40px);justify-content:space-between;gap:24px;
  --bgi:radial-gradient(110% 120% at 90% 0%,rgba(227,169,174,.28),transparent 55%),radial-gradient(70% 90% at 0% 115%,rgba(240,138,46,.12),transparent 60%),linear-gradient(160deg,#321a24,#1b0e14 72%)}
.phero .halo2{position:absolute;right:6%;top:-34%;width:58%;aspect-ratio:1;border-radius:50%;border:1px solid rgba(240,190,198,.10);pointer-events:none;z-index:1}
.phero .halo2.b{right:-8%;top:-14%;width:42%;border-color:rgba(240,190,198,.07)}
.ph-num{position:absolute;z-index:1;right:clamp(24px,3.4vw,52px);bottom:-.2em;font-family:var(--f-display);font-size:clamp(230px,30vw,430px);line-height:.8;letter-spacing:-.05em;color:transparent;-webkit-text-stroke:1.5px rgba(240,190,198,.2);pointer-events:none;user-select:none;
  transform:translate3d(calc(var(--dx) * -26px),calc(var(--dy) * -16px),0);transition:transform .5s var(--ease),-webkit-text-stroke-color .5s,color .6s}
.phero:hover .ph-num{-webkit-text-stroke-color:rgba(251,228,223,.38);color:rgba(251,228,223,.03)}
.phero .pscan{position:absolute;top:0;bottom:0;left:0;width:2px;z-index:3;pointer-events:none;opacity:0;background:linear-gradient(180deg,transparent,rgba(255,240,232,.95) 30%,rgba(255,190,130,.95) 70%,transparent);box-shadow:0 0 16px 3px rgba(240,138,46,.45)}
.phero.on .pscan,.phero.still .pscan{animation:pscanx 7s cubic-bezier(.6,0,.4,1) 2.4s infinite}
@keyframes pscanx{0%{transform:translateX(0);opacity:0}6%{opacity:1}36%{opacity:1}42%{transform:translateX(var(--pw,1100px));opacity:0}100%{transform:translateX(var(--pw,1100px));opacity:0}}
.ph-top{position:relative;z-index:4;display:flex}
.chip{display:inline-flex;align-items:center;gap:9px;height:34px;padding:0 15px 0 13px;border-radius:999px;background:rgba(251,228,223,.08);border:1px solid rgba(251,228,223,.2);font-size:12px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--rose-1)}
.chip i{width:8px;height:8px;border-radius:50%;background:var(--sky);animation:livedot 1.8s ease-out infinite}
.ph-name{position:relative;z-index:4;display:block;max-width:calc(100% - 90px);font-family:var(--f-display);font-size:clamp(72px,10.4vw,150px);line-height:.9;letter-spacing:-.03em;transform:translate3d(calc(var(--dx) * 10px),calc(var(--dy) * 6px),0);transition:transform .45s var(--ease)}
.ph-name .em{padding-right:.06em}
.ph-name .yr{font-size:.4em;letter-spacing:0;margin-left:.14em}
.phero .go{width:66px;height:66px}
.phero .go svg{width:26px;height:26px}

/* ---------- raniji periodi: laserska šina ---------- */
.arch{margin-top:clamp(30px,3.6vw,44px)}
.arail{position:relative;padding-left:48px}
.arail .rail{position:absolute;left:17px;top:34px;bottom:34px;width:2px;border-radius:2px;background:linear-gradient(180deg,rgba(240,190,198,.32),rgba(240,190,198,.08))}
.arail .beam{position:absolute;left:16px;top:34px;bottom:34px;width:4px;border-radius:4px;background:linear-gradient(180deg,#fff,var(--rose-1) 25%,var(--sky));box-shadow:0 0 16px 2px rgba(240,138,46,.7);transform-origin:top;transform:scaleY(0);opacity:0;pointer-events:none}
.arch.enter .beam{animation:beamdown calc(var(--n,4) * .14s + .3s) cubic-bezier(.45,0,.35,1) .35s forwards}
@keyframes beamdown{0%{transform:scaleY(0);opacity:1}88%{opacity:1}100%{transform:scaleY(1);opacity:0}}
.alist{list-style:none;margin:0;padding:0;display:grid;gap:12px}
.prow{position:relative;display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:22px;width:100%;min-height:88px;padding:14px 18px 14px 26px;border-radius:24px;text-align:left;
  background:linear-gradient(160deg,rgba(40,21,29,.92),rgba(26,13,19,.92));border:1px solid var(--line);transition:transform .55s var(--spring),border-color .3s,box-shadow .45s}
.prow::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;background:radial-gradient(420px circle at var(--mx,50%) var(--my,50%),rgba(251,228,223,.09),transparent 45%);opacity:0;transition:opacity .35s}
.prow:hover{transform:translateX(8px);border-color:rgba(240,190,198,.34);box-shadow:0 26px 50px -30px rgba(0,0,0,.95)}
.prow:hover::after{opacity:1}
.prow .node{position:absolute;left:-38px;top:50%;width:14px;height:14px;margin-top:-7px;border-radius:50%;background:var(--bg);border:2px solid rgba(240,190,198,.4);transition:background .3s,border-color .3s,box-shadow .3s}
.prow:hover .node{background:var(--rose-2);border-color:var(--rose-1);box-shadow:0 0 16px rgba(251,228,223,.75)}
.prow .pidx{font-family:var(--f-display);font-size:38px;line-height:1;min-width:1.4em;color:transparent;-webkit-text-stroke:1px rgba(240,190,198,.45);font-variant-numeric:tabular-nums;transition:color .35s,-webkit-text-stroke-color .35s}
.prow:hover .pidx{color:rgba(251,228,223,.16);-webkit-text-stroke-color:rgba(251,228,223,.7)}
.prow .pname{min-width:0;font-family:var(--f-display);font-size:clamp(27px,2.6vw,34px);line-height:1.05}
.prow .pname em{font-style:italic;background:var(--metal);background-size:220% 100%;-webkit-background-clip:text;background-clip:text;color:transparent}
.prow .parr{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;border:1px solid rgba(240,190,198,.22);transition:background .3s,color .3s,border-color .3s,transform .45s var(--spring)}
.prow .parr svg{width:19px;height:19px}
.prow:hover .parr{background:var(--metal);color:#2a1218;border-color:transparent;transform:translateX(3px)}
.prow .pline{position:absolute;left:26px;right:26px;bottom:-1px;height:1.5px;background:linear-gradient(90deg,transparent,var(--rose-1) 30%,var(--sky) 70%,transparent);transform:scaleX(0);transform-origin:left;transition:transform .7s var(--ease)}
.prow:hover .pline{transform:scaleX(1)}
.arch.enter .arow{animation:rowin .8s var(--ease) both;animation-delay:calc(.45s + var(--i) * .14s)}
.arch.enter .prow .node{animation:nodepop .7s var(--spring) both;animation-delay:calc(.45s + var(--i) * .14s)}
@keyframes rowin{from{opacity:0;translate:-30px 0;filter:blur(7px)}to{opacity:1;translate:0 0;filter:none}}
@keyframes nodepop{0%{transform:scale(0)}35%{transform:scale(1.7);background:#fff;border-color:#fff;box-shadow:0 0 24px 6px rgba(240,138,46,.9)}100%{transform:none}}

/* ---------- Loom video / Pisani izveštaj ---------- */
.tgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:clamp(14px,1.8vw,22px)}
.ttile{min-height:clamp(360px,37vw,470px);justify-content:flex-end;
  --art-h:calc(100% - 1.96 * clamp(42px,4.6vw,64px) - clamp(22px,2.8vw,32px) - clamp(26px,3vw,40px) - 24px)}
.ttile .t{font-size:clamp(42px,4.6vw,64px);max-width:none}
.ttile .t span{display:block}
.ttile .t .em{padding-right:.08em}
.ttile .go{width:62px;height:62px}
.ttile .go svg{width:24px;height:24px}
.ttile.dim .art{opacity:.55}
/* Loom: ekran, kamera u krugu, play, traka */
.lart{position:absolute;left:50%;top:clamp(26px,3vw,40px);height:var(--art-h);width:auto;max-width:86%;aspect-ratio:16/10;translate:-50% 0}
.lscr{position:absolute;inset:0;border-radius:20px;overflow:hidden;background:linear-gradient(160deg,#41222e,#1d0f15);border:1px solid rgba(240,190,198,.24);box-shadow:0 34px 70px -34px #000;transform:perspective(900px) rotateX(8deg);transform-origin:50% 100%;transition:transform .8s var(--spring)}
.card:hover .lscr{transform:perspective(900px) rotateX(0) translateY(-8px)}
.lui{position:absolute;left:7%;right:7%;top:9%;display:grid;gap:8px}
.lui i{display:block;height:7px;border-radius:4px;background:rgba(240,190,198,.15)}
.lui i.h{width:44%;height:10px;background:rgba(251,228,223,.4)}
.lui i:nth-child(2){width:76%}.lui i:nth-child(3){width:62%}
.lch{display:flex;align-items:flex-end;gap:6%;height:56px;margin-top:6px;padding-left:46%}
.lch b{flex:1;border-radius:4px 4px 0 0;background:rgba(240,190,198,.2);transform-origin:bottom;animation:grow 3.8s var(--ease) infinite}
.lch b:nth-child(1){height:38%}.lch b:nth-child(2){height:58%;animation-delay:.12s}.lch b:nth-child(3){height:46%;animation-delay:.24s}.lch b:nth-child(4){height:78%;animation-delay:.36s}.lch b:nth-child(5){height:100%;animation-delay:.48s;background:var(--metal)}
.lcam{position:absolute;left:5%;bottom:12%;width:24%;aspect-ratio:1;border-radius:50%;border:2px solid rgba(251,228,223,.9);overflow:hidden;box-shadow:0 12px 26px -10px #000,0 0 0 5px rgba(20,10,14,.35);
  background:radial-gradient(circle at 50% 40%,#f2cccc 0 19%,transparent 20%),radial-gradient(ellipse 46% 40% at 50% 104%,#d99ca5 0 98%,transparent 100%),linear-gradient(160deg,#6c3747,#33192a);animation:talk 2.6s ease-in-out infinite}
@keyframes talk{0%,100%{transform:scale(1)}20%{transform:scale(1.035)}40%{transform:scale(.99)}60%{transform:scale(1.03)}}
.lpl{position:absolute;left:50%;top:47%;width:66px;height:66px;margin:-33px 0 0 -33px;border-radius:50%;display:grid;place-items:center;background:var(--metal);background-size:200% 100%;color:#2a1218;box-shadow:0 16px 40px -10px rgba(212,145,155,.9)}
.lpl svg{width:26px;height:26px;margin-left:4px}
.lpl::before,.lpl::after{content:"";position:absolute;inset:-2px;border-radius:50%;border:1.5px solid rgba(251,228,223,.8);animation:ring 2.4s ease-out infinite}
.lpl::after{animation-delay:1.2s}
.card:hover .lpl{animation:plpop .5s var(--spring)}
@keyframes plpop{40%{transform:scale(1.14)}}
.lbar{position:absolute;left:34%;right:6%;bottom:9%;height:4px;border-radius:2px;background:rgba(255,255,255,.14);overflow:hidden}
.lbar i{position:absolute;inset:0;background:linear-gradient(90deg,var(--rose-2),var(--sky));transform-origin:left;animation:prog 6s linear infinite}
/* Pisani: listovi izveštaja sa laserskim skenom */
.dart{position:absolute;left:50%;top:clamp(26px,3vw,40px);height:var(--art-h);width:auto;max-width:60%;aspect-ratio:3/3.6;translate:-50% 0}
.dpg{position:absolute;inset:0;border-radius:16px;transition:transform .8s var(--spring)}
.dpg.b2{background:linear-gradient(170deg,#3b2029,#25131b);border:1px solid var(--line);transform:rotate(-9deg) translate(-16%,5%)}
.dpg.b1{background:linear-gradient(170deg,#4a2934,#2d1820);border:1px solid rgba(240,190,198,.16);transform:rotate(7deg) translate(13%,3%)}
.dpg.f{background:linear-gradient(175deg,#fbf3f2,#efdcdd);box-shadow:0 30px 60px -26px #000;padding:13% 11%;display:grid;align-content:start;gap:7%;overflow:hidden}
.dpg.f>i{display:block;height:7px;border-radius:4px;background:#dcc6c9}
.dpg.f>i.h{width:58%;height:11px;background:#b8737d}
.dpg.f>i.s{width:70%}
.dkp{display:grid;grid-template-columns:repeat(3,1fr);gap:7%}
.dkp b{height:30px;border-radius:7px;background:#fff;box-shadow:inset 0 0 0 1px #ead6d8;position:relative}
.dkp b::after{content:"";position:absolute;left:18%;right:30%;bottom:26%;height:6px;border-radius:3px;background:#c98d96}
.dch{display:flex;align-items:flex-end;gap:7%;height:54px;padding:6px 8px 0;border-radius:8px;background:#fff;box-shadow:inset 0 0 0 1px #ead6d8}
.dch b{flex:1;border-radius:3px 3px 0 0;background:linear-gradient(#d79aa2,#b8737d);transform-origin:bottom;animation:grow 3.8s var(--ease) infinite}
.dch b:nth-child(1){height:34%}.dch b:nth-child(2){height:52%;animation-delay:.1s}.dch b:nth-child(3){height:44%;animation-delay:.2s}.dch b:nth-child(4){height:70%;animation-delay:.3s}.dch b:nth-child(5){height:62%;animation-delay:.4s}.dch b:nth-child(6){height:92%;animation-delay:.5s}
.dscan{position:absolute;left:0;right:0;top:0;height:2px;background:linear-gradient(90deg,transparent,var(--sky) 20%,#fff 50%,var(--sky) 80%,transparent);box-shadow:0 0 14px 3px rgba(240,138,46,.55);animation:dscan 3.6s cubic-bezier(.6,0,.4,1) infinite}
@keyframes dscan{0%{transform:translateY(-4px);opacity:0}8%{opacity:1}60%{opacity:1}70%{transform:translateY(var(--dh,300px));opacity:0}100%{transform:translateY(var(--dh,300px));opacity:0}}
.card:hover .dpg.b2{transform:rotate(-15deg) translate(-30%,3%)}
.card:hover .dpg.b1{transform:rotate(13deg) translate(28%,1%)}
.card:hover .dpg.f{transform:translateY(-8px) scale(1.03)}

/* ---------- lista izveštaja ---------- */
.rlist{list-style:none;margin:0;padding:0;display:grid;gap:12px;transition:opacity .25s,translate .25s,filter .25s}
.rlist.out,.rempty.out{opacity:0;translate:36px 0;filter:blur(8px)}
.v-list.enter .rli{animation:rowup .8s var(--ease) both;animation-delay:calc(.25s + var(--i) * .09s)}
@keyframes rowup{from{opacity:0;translate:0 26px;filter:blur(8px)}to{opacity:1;translate:0 0;filter:none}}
.ritem{--thw:132px;position:relative;display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:24px;width:100%;padding:14px 18px 14px 14px;border-radius:26px;text-align:left;overflow:hidden;
  background:linear-gradient(160deg,rgba(41,22,30,.94),rgba(26,13,19,.94));border:1px solid var(--line);transition:transform .55s var(--spring),border-color .3s,box-shadow .45s}
.ritem::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;background:radial-gradient(460px circle at var(--mx,50%) var(--my,50%),rgba(251,228,223,.09),transparent 45%);opacity:0;transition:opacity .35s}
.ritem:hover{transform:translateY(-4px);border-color:rgba(240,190,198,.34);box-shadow:0 30px 60px -34px rgba(0,0,0,.95)}
.ritem:hover::after{opacity:1}
.ritem.first{--thw:208px;padding:18px 22px 18px 18px;border-color:rgba(240,190,198,.22);
  background:radial-gradient(90% 140% at 100% 0%,rgba(227,169,174,.14),transparent 60%),linear-gradient(160deg,rgba(48,25,35,.95),rgba(27,14,20,.95))}
.ritem .rsweep{position:absolute;left:0;bottom:0;height:1.5px;width:100%;background:linear-gradient(90deg,transparent,var(--rose-1) 30%,var(--sky) 70%,transparent);transform:scaleX(0);transform-origin:left;transition:transform .7s var(--ease)}
.ritem:hover .rsweep{transform:scaleX(1)}
.rth{position:relative;width:var(--thw);max-width:100%;aspect-ratio:16/10;border-radius:16px;overflow:hidden;border:1px solid rgba(240,190,198,.22);box-shadow:0 16px 34px -20px #000;background:linear-gradient(160deg,#4a2733,#22121a)}
.rth.loom::before{content:"";position:absolute;left:9%;right:36%;top:14%;height:7%;border-radius:4px;background:rgba(251,228,223,.32);box-shadow:0 calc(var(--thw) * .09) 0 rgba(240,190,198,.16),0 calc(var(--thw) * .18) 0 rgba(240,190,198,.11)}
.rth .pl{position:absolute;left:50%;top:50%;width:32%;aspect-ratio:1;translate:-50% -50%;border-radius:50%;display:grid;place-items:center;background:rgba(20,10,14,.5);border:1px solid rgba(251,228,223,.6);color:var(--rose-1);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);transition:background .3s,color .3s,transform .45s var(--spring)}
.rth .pl svg{width:42%;height:42%;margin-left:7%}
.ritem:hover .rth .pl{background:var(--metal);color:#2a1218;border-color:transparent;transform:scale(1.1)}
.rth .cam{position:absolute;left:6%;bottom:11%;width:25%;aspect-ratio:1;border-radius:50%;border:1.5px solid rgba(251,228,223,.85);
  background:radial-gradient(circle at 50% 40%,#f2cccc 0 19%,transparent 20%),radial-gradient(ellipse 46% 40% at 50% 104%,#d99ca5 0 98%,transparent 100%),linear-gradient(160deg,#6c3747,#33192a)}
.rth .bar{position:absolute;left:0;right:0;bottom:0;height:3px;background:rgba(255,255,255,.14)}
.rth .bar::after{content:"";position:absolute;left:0;top:0;bottom:0;width:36%;background:linear-gradient(90deg,var(--rose-2),var(--sky))}
.rth.doc{background:linear-gradient(160deg,#3d212b,#21111a)}
.rth .pg{position:absolute;left:50%;top:13%;width:46%;height:100%;translate:-50% 0;border-radius:6px 6px 0 0;background:linear-gradient(175deg,#fbf3f2,#efdcdd);box-shadow:0 10px 22px -6px #000;padding:10% 9%;display:grid;align-content:start;gap:calc(var(--thw) * .035);transition:transform .55s var(--spring)}
.rth .pg i{display:block;height:calc(var(--thw) * .03);min-height:3px;border-radius:3px;background:#dcc6c9}
.rth .pg i:first-child{width:62%;background:#b8737d}
.rth .pg i.k{height:calc(var(--thw) * .09);background:linear-gradient(90deg,#e9d3d6 0 30%,transparent 30% 35%,#e9d3d6 35% 65%,transparent 65% 70%,#e9d3d6 70%)}
.ritem:hover .rth .pg{transform:translateY(-7%)}
.rbody{display:grid;gap:8px;min-width:0}
.rtitle{font-family:var(--f-display);font-size:clamp(24px,2.4vw,31px);line-height:1.12;letter-spacing:-.005em;overflow-wrap:anywhere}
.ritem.first .rtitle{font-size:clamp(30px,3.2vw,44px)}
.rdate{font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums}
.ract{display:inline-flex;align-items:center;gap:9px;height:48px;padding:0 20px;border-radius:999px;background:var(--metal);background-size:200% 100%;color:#2a1218;font-weight:600;font-size:15px;white-space:nowrap;box-shadow:0 14px 34px -14px rgba(212,145,155,.85);transition:background-position .8s,transform .45s var(--spring)}
.ract svg{width:17px;height:17px}
.ritem:hover .ract{background-position:100% 0;transform:translateX(3px)}
.rempty{display:grid;justify-items:center;gap:20px;padding:clamp(44px,6vw,72px) 20px;border-radius:28px;border:1px dashed rgba(240,190,198,.2);text-align:center;transition:opacity .25s,translate .25s,filter .25s}
.rempty .ric{width:72px;height:72px;border-radius:50%;display:grid;place-items:center;background:rgba(251,228,223,.06);border:1px solid rgba(240,190,198,.18);color:var(--rose-2)}
.rempty .ric svg{width:28px;height:28px}
.rempty h2{margin:0;font-family:var(--f-display);font-weight:400;font-size:clamp(28px,3vw,38px)}
.rstate{display:grid;justify-items:center;gap:16px;padding:90px 20px;color:var(--muted);text-align:center}
.rstate b{font-family:var(--f-display);font-weight:400;font-size:30px;color:var(--cream)}
.lscanbar{position:relative;width:min(240px,60vw);height:2px;border-radius:2px;background:rgba(240,190,198,.15);overflow:hidden}
.lscanbar::after{content:"";position:absolute;top:0;bottom:0;width:40%;background:linear-gradient(90deg,transparent,#fff,var(--sky),transparent);box-shadow:0 0 12px rgba(240,138,46,.8);animation:lscan 1.2s ease-in-out infinite}
@keyframes lscan{from{left:-40%}to{left:100%}}

/* ---------- pisani izveštaj ---------- */
.rapp.viewing{height:100vh;height:100dvh;min-height:0;display:flex;flex-direction:column;padding-bottom:0}
.rapp.viewing .rmain,.rapp.viewing .rtop-in{width:min(1240px,100%)}
.rapp.viewing .rmain{flex:1;min-height:0;display:flex;flex-direction:column}
.v-view{flex:1;min-height:0;display:flex;flex-direction:column;gap:18px;padding:10px 0 max(16px,env(safe-area-inset-bottom,0px))}
.vhead{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:14px 20px}
.vh1{margin:0;min-width:0;font-family:var(--f-display);font-weight:400;font-size:clamp(30px,3.6vw,50px);line-height:1.05;letter-spacing:-.01em;outline:none;overflow-wrap:anywhere}
.vframe{position:relative;flex:1;min-height:320px;border-radius:24px;overflow:hidden;background:var(--bg-2);border:1px solid rgba(240,190,198,.18);box-shadow:0 40px 80px -50px #000}
.vframe iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:#fff;opacity:0;transition:opacity .5s}
.vframe iframe.ready{opacity:1}
.vload{position:absolute;inset:0;display:grid;place-items:center;align-content:center;gap:16px;color:var(--muted);text-align:center;padding:20px}
.vfail b{font-family:var(--f-display);font-weight:400;font-size:26px;color:var(--cream)}
.v-view.enter .vhead{animation:cin .8s .15s var(--ease) both}
.v-view.enter .vframe{animation:cin .9s .3s var(--ease) both}

/* ---------- Loom plejer ---------- */
.lov{position:fixed;inset:0;z-index:58;display:grid;place-items:center;padding:max(20px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(20px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));overflow-y:auto}
.lov-scrim{position:fixed;inset:0;background:rgba(10,5,7,.82);-webkit-backdrop-filter:blur(18px) saturate(.8);backdrop-filter:blur(18px) saturate(.8);opacity:0;transition:opacity .4s}
.lov.on .lov-scrim{opacity:1}
.lov-box{position:relative;width:min(1000px,100%);display:grid;gap:22px}
.lov-screen{position:relative;width:100%;aspect-ratio:16/9;border-radius:26px;overflow:hidden;background:linear-gradient(160deg,#41222e,#160b10);border:1px solid rgba(240,190,198,.24);box-shadow:0 60px 120px -40px #000,0 0 0 1px rgba(0,0,0,.4);will-change:transform}
.lov-screen iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.lp{position:absolute;inset:0;display:block;color:inherit;text-decoration:none;cursor:pointer}
.lp.demo{cursor:default}
.lp-ui{position:absolute;left:6%;right:6%;top:9%;display:grid;gap:12px}
.lp-ui i{display:block;height:10px;border-radius:5px;background:rgba(240,190,198,.13)}
.lp-ui i:first-child{width:38%;height:14px;background:rgba(251,228,223,.32)}
.lp-ui i:nth-child(2){width:70%}.lp-ui i:nth-child(3){width:56%}.lp-ui i:nth-child(4){width:64%}
.lp-cam{position:absolute;left:4%;bottom:9%;width:18%;aspect-ratio:1;border-radius:50%;border:3px solid rgba(251,228,223,.9);box-shadow:0 20px 40px -14px #000,0 0 0 8px rgba(20,10,14,.35);
  background:radial-gradient(circle at 50% 40%,#f2cccc 0 19%,transparent 20%),radial-gradient(ellipse 46% 40% at 50% 104%,#d99ca5 0 98%,transparent 100%),linear-gradient(160deg,#6c3747,#33192a);animation:talk 2.6s ease-in-out infinite}
.lp-play{position:absolute;left:50%;top:50%;width:clamp(76px,11vw,112px);aspect-ratio:1;translate:-50% -50%;border-radius:50%;display:grid;place-items:center;background:var(--metal);background-size:200% 100%;color:#2a1218;box-shadow:0 20px 50px -12px rgba(212,145,155,.9);transition:transform .5s var(--spring),background-position .8s}
.lp-play svg{width:38%;height:38%;margin-left:7%}
.lp-play::before,.lp-play::after{content:"";position:absolute;inset:-2px;border-radius:50%;border:2px solid rgba(251,228,223,.8);animation:ring 2.4s ease-out infinite}
.lp-play::after{animation-delay:1.2s}
.lp:hover .lp-play{transform:scale(1.08);background-position:100% 0}
.lov-info{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:16px 24px;opacity:0;translate:0 14px;transition:opacity .45s,translate .6s var(--ease)}
.lov.on .lov-info{opacity:1;translate:0 0;transition-delay:.28s}
.lov-info h2{margin:0;min-width:0;font-family:var(--f-display);font-weight:400;font-size:clamp(28px,3.2vw,44px);line-height:1.08;overflow-wrap:anywhere}
.lov-acts{display:flex;flex-wrap:wrap;gap:10px}
.lov-x{position:absolute;top:-18px;right:-18px;z-index:2;width:48px;height:48px;border-radius:50%;display:grid;place-items:center;background:var(--metal);color:#2a1218;box-shadow:0 14px 30px -10px #000;opacity:0;transform:scale(.6) rotate(-90deg);transition:opacity .3s,transform .55s var(--spring)}
.lov.on .lov-x{opacity:1;transform:none;transition-delay:.2s}
.lov-x svg{width:20px;height:20px}

/* ---------- obaveštenje + laserski prelaz ---------- */
.toast{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom,0px));z-index:62;display:flex;align-items:center;gap:12px;max-width:calc(100vw - 32px);padding:8px 8px 8px 18px;border-radius:999px;background:rgba(38,20,28,.94);border:1px solid rgba(240,190,198,.28);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);box-shadow:0 30px 60px -20px #000,0 0 40px -10px rgba(240,138,46,.4);transform:translate(-50%,160%);transition:transform .7s var(--spring);font-size:15px}
.toast.show{transform:translate(-50%,0)}
.toast .tdot{width:9px;height:9px;flex:none;border-radius:50%;background:var(--sky);animation:livedot 1.8s ease-out infinite}
.toast #toastMsg{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.toast button{flex:none;height:40px;padding:0 16px;border-radius:999px;background:var(--metal);color:#2a1218;font-weight:600;font-size:14px}
.wipe{position:fixed;top:0;bottom:0;left:0;width:3px;z-index:45;pointer-events:none;opacity:0;background:linear-gradient(180deg,transparent,#fff 18%,#ffd9bd 50%,#fff 82%,transparent);box-shadow:0 0 18px 4px rgba(255,214,206,.9),0 0 70px 16px rgba(240,138,46,.45)}
.wipe.go{animation:wipex .75s cubic-bezier(.65,0,.3,1) forwards}
@keyframes wipex{0%{opacity:1;transform:translateX(-12px)}88%{opacity:1}100%{opacity:0;transform:translateX(calc(100vw + 12px))}}


/* =========================================================
   CREATIVE INSPECTION
   periodi → skripte (laserska šina faza) → skripta na papiru + komentari
   ========================================================= */
@property --rv{syntax:"<length>";inherits:true;initial-value:0px}
.cnav{order:4;display:flex;gap:8px}
.cnav button{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;border:1px solid var(--line);background:rgba(255,255,255,.03);color:var(--cream);transition:background .25s,border-color .25s,transform .45s var(--spring),opacity .25s}
.cnav button svg{width:20px;height:20px}
.cnav button:hover:not(:disabled){background:rgba(240,190,198,.08);border-color:rgba(240,190,198,.32)}
.cnav #cprev:hover:not(:disabled){transform:translateX(-3px)}
.cnav #cnext:hover:not(:disabled){transform:translateX(3px)}
.cnav button:disabled{opacity:.28;cursor:default}

/* laserska šina: 6 faza, popunjena do trenutne */
.trk{display:grid;gap:11px;min-width:0}
.tlab{justify-self:start;padding-right:.1em;font-family:var(--f-display);font-style:italic;font-size:22px;line-height:1.05;white-space:nowrap;background:var(--metal);background-size:220% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:metal 7s linear infinite}
.tk{position:relative;display:block;height:18px;margin:0 9px}
.tk>i{position:absolute;top:50%;display:block}
.tk .tb{left:0;right:0;height:2px;margin-top:-1px;border-radius:2px;background:repeating-linear-gradient(90deg,rgba(240,190,198,.26) 0 7px,transparent 7px 12px)}
.tk .tf{left:0;right:0;height:3px;margin-top:-1.5px;border-radius:3px;transform-origin:0 50%;transform:scaleX(var(--to));background:linear-gradient(90deg,var(--rose-3),var(--rose-2) 60%,var(--rose-1));box-shadow:0 0 12px rgba(227,169,174,.55)}
.tk .th{left:calc(var(--to) * 100%);width:12px;height:12px;margin:-6px 0 0 -6px;border-radius:50%;background:#fff;opacity:0;z-index:3;pointer-events:none;box-shadow:0 0 8px 2px #ffd8b0,0 0 24px 8px rgba(255,138,46,.75),0 0 60px 16px rgba(255,120,40,.3)}
.trk.anim .tf{animation:tkf var(--dur) cubic-bezier(.6,0,.3,1) var(--td) both}
.trk.anim .th{animation:tkh var(--dur) cubic-bezier(.6,0,.3,1) var(--td) both}
@keyframes tkf{from{transform:scaleX(var(--from))}to{transform:scaleX(var(--to))}}
@keyframes tkh{0%{left:calc(var(--from) * 100%);opacity:1}88%{opacity:1}100%{left:calc(var(--to) * 100%);opacity:0}}
.tn{left:calc(var(--x) * 100%);width:12px;height:12px;margin:-6px 0 0 -6px;border-radius:50%;z-index:2;display:grid!important;place-items:center;background:var(--bg);border:1.5px solid rgba(240,190,198,.32);color:#2a1218}
.tn.d{background:var(--rose-2);border-color:var(--rose-1);box-shadow:0 0 10px rgba(227,169,174,.45)}
.tn.c{width:18px;height:18px;margin:-9px 0 0 -9px;border:0;background:radial-gradient(circle,#fff 0 28%,#ffd9bd 46%,var(--sky) 100%);box-shadow:0 0 0 4px rgba(240,138,46,.16),0 0 20px 3px rgba(240,138,46,.7)}
.tn.c::after{content:"";position:absolute;inset:-6px;border-radius:50%;border:1.5px solid rgba(255,190,130,.85);animation:tring 2.4s ease-out var(--rd,0s) infinite both}
@keyframes tring{0%{transform:scale(1);opacity:0}12%{opacity:1}100%{transform:scale(2.1);opacity:0}}
.trk.fin .tn.c{background:var(--metal);background-size:200% 100%;box-shadow:0 0 0 4px rgba(227,169,174,.16),0 0 22px rgba(227,169,174,.8)}
.trk.fin .tn.c::after{border-color:rgba(251,228,223,.8)}
.tn svg{width:62%;height:62%}
.trk.anim .tn[data-ig]{animation:tnig .7s var(--spring) var(--nd) both}
@keyframes tnig{0%{transform:scale(.5);background:var(--bg);box-shadow:none}35%{transform:scale(1.9);background:#fff;box-shadow:0 0 26px 8px rgba(240,138,46,.95)}100%{transform:none}}
.trk.big{gap:16px}
.trk.big .tlab{display:none}
.trk.big .tk{height:28px;margin:0 13px}
.trk.big .tf{height:4px;margin-top:-2px}
.trk.big .tb{height:2px}
.trk.big .tn{width:16px;height:16px;margin:-8px 0 0 -8px}
.trk.big .tn.c{width:28px;height:28px;margin:-14px 0 0 -14px}
.trk.big .th{width:16px;height:16px;margin:-8px 0 0 -8px}
.tls{position:relative;display:block;height:30px;margin:0 13px}
.tl{position:absolute;top:2px;left:calc(var(--x) * 100%);transform:translateX(-50%);white-space:nowrap;font-size:15px;line-height:1.2;color:rgba(247,233,232,.36)}
.tl:first-child{transform:translateX(-13px)}
.tl:last-child{transform:translateX(calc(-100% + 13px))}
.tl.d{color:rgba(247,233,232,.72)}
.tl.c{top:-3px;font-family:var(--f-display);font-style:italic;font-size:25px;line-height:1;padding-right:.08em;background:var(--metal);background-size:220% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:metal 7s linear infinite}
.v-script.enter .tl{animation:tlin .7s var(--ease) both;animation-delay:calc(.75s + var(--k) * .09s)}
.v-script.enter .tl.c{animation:tlin .7s var(--ease) calc(.75s + var(--k) * .09s) both,metal 7s linear infinite}
@keyframes tlin{from{opacity:0;translate:0 10px;filter:blur(6px)}to{opacity:1;translate:0 0;filter:none}}

/* lista skripti */
.slist{list-style:none;margin:0;padding:0;display:grid;gap:12px;transition:opacity .25s,translate .25s,filter .25s}
.v-scripts.enter .sli{animation:rowup .8s var(--ease) both;animation-delay:calc(.25s + var(--i) * .08s)}
.sitem{position:relative;display:grid;grid-template-columns:auto minmax(0,1fr) minmax(210px,300px) auto;align-items:center;gap:28px;width:100%;min-height:110px;padding:18px 20px 18px 28px;border-radius:26px;text-align:left;overflow:hidden;
  background:linear-gradient(160deg,rgba(41,22,30,.94),rgba(26,13,19,.94));border:1px solid var(--line);transition:transform .55s var(--spring),border-color .3s,box-shadow .45s}
.sitem::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;background:radial-gradient(460px circle at var(--mx,50%) var(--my,50%),rgba(251,228,223,.09),transparent 45%);opacity:0;transition:opacity .35s}
.sitem:hover{transform:translateY(-4px);border-color:rgba(240,190,198,.34);box-shadow:0 30px 60px -34px rgba(0,0,0,.95)}
.sitem:hover::after{opacity:1}
.sitem .sidx{font-family:var(--f-display);font-size:42px;line-height:1;min-width:1.25em;color:transparent;-webkit-text-stroke:1px rgba(240,190,198,.45);font-variant-numeric:tabular-nums;transition:color .35s,-webkit-text-stroke-color .35s}
.sitem:hover .sidx{color:rgba(251,228,223,.16);-webkit-text-stroke-color:rgba(251,228,223,.7)}
.stitle{min-width:0;font-family:var(--f-display);font-size:clamp(25px,2.5vw,33px);line-height:1.1;letter-spacing:-.005em;overflow-wrap:anywhere}
.stitle .nw{white-space:nowrap}
.scm{display:inline-grid;place-items:center;vertical-align:.1em;width:28px;height:28px;margin-left:12px;border-radius:50%;background:rgba(240,138,46,.12);color:#ffb37a;box-shadow:0 0 0 1px rgba(240,138,46,.35)}
.scm svg{width:15px;height:15px}
.sitem .parr{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;border:1px solid rgba(240,190,198,.22);transition:background .3s,color .3s,border-color .3s,transform .45s var(--spring)}
.sitem .parr svg{width:19px;height:19px}
.sitem:hover .parr{background:var(--metal);color:#2a1218;border-color:transparent;transform:translateX(3px)}
.sitem .rsweep{position:absolute;left:0;bottom:0;height:1.5px;width:100%;background:linear-gradient(90deg,transparent,var(--rose-1) 30%,var(--sky) 70%,transparent);transform:scaleX(0);transform-origin:left;transition:transform .7s var(--ease)}
.sitem:hover .rsweep{transform:scaleX(1)}
.sitem:hover .tf{box-shadow:0 0 16px rgba(240,138,46,.55)}
.sitem.done .stitle{color:rgba(247,233,232,.86)}

/* jedna skripta */
.rapp.ci-script .rmain,.rapp.ci-script .rtop-in{width:min(1240px,100%)}
.v-script{transition:opacity .25s,translate .25s,filter .25s}
.v-script.out,.slist.out{opacity:0;translate:36px 0;filter:blur(8px)}
.v-script .rhead{margin:22px 0 30px}
.sh1{font-size:clamp(44px,5.6vw,84px);line-height:1.04;max-width:16ch}
.sh1 .ew{margin-right:.02em}
.spipe{max-width:900px;margin:0 0 46px}
.sgrid{display:grid;grid-template-columns:minmax(0,1fr) 352px;gap:30px;align-items:start}

/* papir */
.paper{position:relative;min-width:0}
.psheet{position:relative;border-radius:30px;color:#3a2229;padding:clamp(30px,4.6vw,66px) clamp(24px,4.8vw,70px) clamp(36px,4.8vw,72px);
  background:radial-gradient(120% 50% at 100% 0%,rgba(255,255,255,.7),transparent 60%),radial-gradient(90% 60% at 0% 100%,rgba(227,169,174,.14),transparent 70%),linear-gradient(176deg,#fdf7f6,#f3e3e3);
  box-shadow:0 70px 120px -70px #000,0 30px 60px -44px rgba(0,0,0,.9),inset 0 1px 0 #fff,inset 0 0 0 1px rgba(255,255,255,.5)}
.paper.scan{animation:prv 1.15s cubic-bezier(.65,0,.25,1) .5s both}
@keyframes prv{from{--rv:0px}to{--rv:var(--vh,900px)}}
.paper.scan .psheet{-webkit-mask:linear-gradient(180deg,#000 calc(var(--rv) - 2px),transparent calc(var(--rv) + 2px));mask:linear-gradient(180deg,#000 calc(var(--rv) - 2px),transparent calc(var(--rv) + 2px))}
.pline{position:absolute;left:-12px;right:-12px;top:var(--rv);height:2px;margin-top:-1px;z-index:4;pointer-events:none;opacity:0;border-radius:2px;background:linear-gradient(90deg,transparent,#fff 10%,#ffd9bd 50%,#fff 90%,transparent);box-shadow:0 0 16px 3px rgba(255,214,206,.95),0 0 60px 14px rgba(240,138,46,.5)}
.paper.scan .pline{opacity:1}
.pbody{font-size:18px;line-height:1.78;color:#3a2229;overflow-wrap:anywhere}
.pbody>*:first-child{margin-top:0}
.pbody>*:last-child{margin-bottom:0}
.pbody h1,.pbody h2,.pbody h3{font-family:var(--f-display);font-weight:400;color:#24131a;line-height:1.12;letter-spacing:-.005em}
.pbody h1{font-size:40px;margin:1.1em 0 .45em}
.pbody h2{font-size:31px;margin:1.25em 0 .4em}
.pbody h3{font-size:24px;margin:1.1em 0 .3em}
.pbody p{margin:0 0 .85em}
.pbody .grey{color:#a1838b;font-style:italic}
.pbody b,.pbody strong{font-weight:600;color:#24131a}
.pbody ul,.pbody ol{margin:0 0 1em;padding-left:1.35em}
.pbody li{margin:.2em 0;padding-left:.2em}
.pbody li::marker{color:#c58591}
.pbody blockquote{margin:1.2em 0;padding:.15em 0 .15em 1.1em;border-left:3px solid #d4919b;font-style:italic;color:#5a3a43}
.pbody hr{border:0;height:1px;margin:1.8em 0;background:linear-gradient(90deg,transparent,#d9aeb5,transparent)}
.pbody table{width:100%;border-collapse:separate;border-spacing:0;margin:1em 0;border:1px solid #ead2d5;border-radius:14px;overflow:hidden;font-size:16px;line-height:1.5}
.pbody th,.pbody td{padding:10px 12px;text-align:left;vertical-align:top;border-right:1px solid #ead2d5;border-bottom:1px solid #ead2d5}
.pbody th{background:#f7e8e9;font-weight:600;color:#24131a}
.pbody tr>*:last-child{border-right:0}
.pbody tbody tr:last-child>*{border-bottom:0}
.pbody img{display:block;max-width:100%;height:auto;margin:1em 0;border-radius:18px;box-shadow:0 20px 40px -26px rgba(42,18,24,.55)}
.pbody .pfile{display:inline-flex;align-items:center;gap:8px;padding:6px 14px;border-radius:999px;background:#f3dfe1;color:#5a2b35;font-size:15px;font-weight:500;text-decoration:none}
.pbody .pfile.off{opacity:.7}
.pbody ::selection{background:rgba(240,138,46,.3);color:#1d0f14}
.pempty{display:grid;justify-items:center;gap:14px;padding:40px 10px;text-align:center;color:#8d6d75}
.pempty .ric{width:64px;height:64px;border-radius:50%;display:grid;place-items:center;background:#f3e0e2;color:#b8737d}
.pempty .ric svg{width:26px;height:26px}
.pempty b{font-family:var(--f-display);font-weight:400;font-size:28px;color:#3a2229}
/* podvlake komentara */
.pbody mark{color:inherit;border-radius:3px}
.pbody mark.hl{padding:.04em 1px;margin:0 -1px;cursor:pointer;background:linear-gradient(rgba(227,169,174,.55),rgba(227,169,174,.55)) 0 0/100% 100% no-repeat;box-shadow:inset 0 -2px 0 #c97887;transition:box-shadow .3s}
.pbody mark.hl.lit{background-image:linear-gradient(rgba(240,138,46,.32),rgba(240,138,46,.32));box-shadow:inset 0 -2px 0 #f08a2e}
.pbody mark.hl.burn{animation:hlburn .9s cubic-bezier(.6,0,.3,1) both}
@keyframes hlburn{from{background-size:0% 100%;box-shadow:inset 0 0 0 transparent}to{background-size:100% 100%}}
.pbody mark.hl.flash{animation:hlflash 1.4s ease-out}
@keyframes hlflash{0%,25%{box-shadow:inset 0 -2px 0 #f08a2e,0 0 0 3px rgba(240,138,46,.45),0 0 26px rgba(240,138,46,.6)}100%{box-shadow:inset 0 -2px 0 #c97887,0 0 0 0 transparent,0 0 0 transparent}}
.pbody mark.pend{padding:.04em 1px;margin:0 -1px;background:rgba(240,138,46,.24);box-shadow:inset 0 -2px 0 #f08a2e;animation:pendp 1.6s ease-in-out infinite}
@keyframes pendp{50%{background:rgba(240,138,46,.12)}}

/* komentari */
.crail{position:sticky;top:96px;display:flex;flex-direction:column;gap:14px;min-width:0;max-height:calc(100vh - 112px)}
.chd,.cnew{display:none}
.ccomp{flex:none}
.cform{position:relative;display:grid;gap:10px;padding:12px;border-radius:24px;background:linear-gradient(160deg,rgba(46,24,33,.96),rgba(28,14,21,.96));border:1px solid rgba(240,190,198,.18);box-shadow:0 30px 60px -40px #000;transition:border-color .3s,box-shadow .4s}
.cform:focus-within,.cform.has-q{border-color:rgba(240,190,198,.44);box-shadow:0 30px 60px -40px #000,0 0 0 4px rgba(227,169,174,.07)}
.cform.ping{animation:cping .8s var(--ease)}
@keyframes cping{0%{box-shadow:0 0 0 2px rgba(255,240,232,.9),0 0 50px rgba(240,138,46,.55)}100%{box-shadow:0 30px 60px -40px #000,0 0 0 4px rgba(227,169,174,.07)}}
.cta{display:block;width:100%;min-height:46px;max-height:240px;resize:none;border:0;outline:0;background:transparent;color:var(--cream);font:inherit;font-size:16px;line-height:1.55;padding:10px 10px 6px}
.cta::placeholder{color:rgba(184,158,164,.75)}
.cfoot{display:flex;justify-content:flex-end;align-items:center;gap:8px}
.cform:not(.open) .cfoot{display:none}
.csend{display:inline-flex;align-items:center;gap:8px;height:46px;padding:0 18px 0 22px;border-radius:999px;background:var(--metal);background-size:200% 100%;color:#2a1218;font-weight:600;font-size:15px;box-shadow:0 14px 30px -14px rgba(212,145,155,.85);transition:opacity .25s,transform .45s var(--spring),background-position .8s}
.csend svg{width:17px;height:17px;transition:transform .45s var(--spring)}
.csend:disabled{opacity:.32;cursor:default;box-shadow:none}
.csend:not(:disabled):hover{background-position:100% 0}
.csend:not(:disabled):hover svg{transform:translateX(3px)}
.cclose{height:46px;padding:0 18px;border-radius:999px;color:var(--muted);font-weight:500;font-size:15px}
.cclose:hover{color:var(--cream)}
.cq{display:flex;align-items:flex-start;gap:8px;padding:10px 6px 10px 14px;border-radius:16px;background:rgba(240,138,46,.08);box-shadow:inset 3px 0 0 var(--sky)}
.cqt{flex:1;min-width:0;font-family:var(--f-display);font-style:italic;font-size:17px;line-height:1.35;color:var(--rose-1);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.cqx{flex:none;width:32px;height:32px;border-radius:50%;display:grid;place-items:center;color:var(--muted);transition:background .2s,color .2s}
.cqx:hover{background:rgba(255,255,255,.06);color:var(--cream)}
.cqx svg{width:14px;height:14px}
.clist{list-style:none;margin:0;padding:2px 4px 10px 2px;display:grid;align-content:start;gap:12px;overflow-y:auto;min-height:0;overscroll-behavior:contain;scrollbar-width:thin;scrollbar-color:rgba(240,190,198,.2) transparent}
.cc{position:relative;display:grid;gap:10px;padding:16px 14px 10px 18px;border-radius:22px;background:linear-gradient(160deg,rgba(40,21,29,.94),rgba(25,13,18,.94));border:1px solid var(--line);transition:border-color .3s,box-shadow .4s,opacity .35s,transform .35s var(--ease)}
.cc.lit{border-color:rgba(240,138,46,.55);box-shadow:0 0 0 1px rgba(240,138,46,.22),0 22px 44px -26px rgba(240,138,46,.55)}
.v-script.enter .cc{animation:ccrow .75s var(--ease) both;animation-delay:calc(1.15s + var(--i) * .09s)}
@keyframes ccrow{from{opacity:0;translate:26px 0;filter:blur(6px)}to{opacity:1;translate:0 0;filter:none}}
@keyframes ccin{0%{opacity:0;transform:translateY(-18px) scale(.95);box-shadow:0 0 0 2px #fff,0 0 70px rgba(240,138,46,.85)}55%{opacity:1}100%{transform:none}}
.cc.flash{animation:ccflash 1.3s ease-out!important}
@keyframes ccflash{0%,20%{box-shadow:0 0 0 2px rgba(255,240,232,.95),0 0 50px rgba(240,138,46,.6)}100%{box-shadow:0 0 0 0 transparent}}
.cc.gone{opacity:0;transform:translateX(30px) scale(.96)}
.cquote{display:block;width:100%;text-align:left;padding:1px 0 1px 13px;border-left:2px solid var(--rose-2);font-family:var(--f-display);font-style:italic;font-size:17px;line-height:1.35;color:var(--rose-1);transition:border-color .3s,color .3s;overflow-wrap:anywhere}
.cquote:not(:disabled):hover,.cc.lit .cquote:not(:disabled){border-left-color:var(--sky);color:#fff}
.cquote:disabled{cursor:default}
.cquote.lost{text-decoration:line-through;text-decoration-color:rgba(240,190,198,.55);opacity:.55}
.ctext{margin:0;font-size:15.5px;line-height:1.55;white-space:pre-wrap;overflow-wrap:anywhere}
.cmeta{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:32px;font-size:13px;color:var(--muted)}
.cdel{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;color:var(--muted);opacity:0;transition:opacity .25s,background .25s,color .25s}
.cc:hover .cdel,.cdel:focus-visible{opacity:1}
@media (hover:none){.cdel{opacity:.75}}
.cdel:hover{background:rgba(255,139,126,.12);color:#ff8b7e}
.cdel svg{width:16px;height:16px}
.cc.res{background:linear-gradient(160deg,rgba(34,18,25,.7),rgba(22,11,16,.7))}
.cc.res .ctext,.cc.res .cquote{opacity:.6}
.cres{display:inline-flex;align-items:center;gap:9px;font-size:12px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--rose-1)}
.cok{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;background:var(--metal);background-size:200% 100%;color:#2a1218;box-shadow:0 0 16px rgba(227,169,174,.5)}
.cok svg{width:14px;height:14px}
.cc.justres .cok{animation:okpop .8s var(--spring) both}
.cc.justres .cok svg path{stroke-dasharray:24;stroke-dashoffset:24;animation:okdraw .5s .25s ease-out forwards}
@keyframes okpop{0%{transform:scale(0) rotate(-90deg)}60%{transform:scale(1.3)}100%{transform:none}}
@keyframes okdraw{to{stroke-dashoffset:0}}
.cnone{padding:18px;border-radius:18px;border:1px dashed rgba(240,190,198,.2);color:var(--muted);font-size:15px}

/* dugme "Komentariši" iznad označenog teksta (na telefonu dole) */
.selbtn{position:fixed;left:0;top:0;z-index:64;display:inline-flex;align-items:center;gap:9px;height:46px;padding:0 20px 0 15px;border-radius:999px;background:var(--metal);background-size:200% 100%;color:#2a1218;font-weight:600;font-size:15px;white-space:nowrap;
  box-shadow:0 18px 40px -12px rgba(0,0,0,.95),inset 0 0 0 1px rgba(255,255,255,.4),0 0 34px -6px rgba(240,138,46,.65);opacity:0;transform:translate(-50%,8px) scale(.6);transition:opacity .2s,transform .5s var(--spring),background-position .8s;will-change:transform}
.selbtn.on{opacity:1;transform:translate(-50%,0) scale(1)}
.selbtn:hover{background-position:100% 0}
.selbtn svg{width:19px;height:19px;flex:none}
.selbtn::after{content:"";position:absolute;left:50%;bottom:-5px;width:12px;height:12px;margin-left:-6px;border-radius:2px;background:#e8b4b9;transform:rotate(45deg);z-index:-1}
.selbtn.below::after{bottom:auto;top:-5px;background:#f6d6d3}
.selbtn.dock{left:50%!important;top:auto!important;bottom:calc(22px + env(safe-area-inset-bottom,0px));height:56px;padding:0 26px 0 20px;font-size:16px}
.selbtn.dock::after{display:none}
.selbtn.dock svg{width:21px;height:21px}

/* komentar na telefonu: donji prozor */
.csheet{position:fixed;inset:0;z-index:66;display:flex;align-items:flex-end;justify-content:center}
.cs-scrim{position:absolute;inset:0;background:rgba(10,5,7,.62);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);opacity:0;transition:opacity .35s}
.csheet.on .cs-scrim{opacity:1}
.cs-box{position:relative;width:min(640px,100%);margin-bottom:var(--kb,0px);padding:10px 10px calc(10px + env(safe-area-inset-bottom,0px));transform:translateY(110%);transition:transform .55s var(--spring),margin-bottom .2s}
.csheet.on .cs-box{transform:none}
.cs-grab{display:block;width:44px;height:5px;margin:0 auto 10px;border-radius:3px;background:rgba(240,190,198,.38)}
.cs-box .cform{border-radius:28px;padding:14px;background:linear-gradient(160deg,#36202a,#21111a);box-shadow:0 -20px 60px -20px rgba(0,0,0,.9)}
.cs-box .cta{min-height:80px;font-size:17px}

@media (max-width:1099px){
  .sgrid{grid-template-columns:minmax(0,1fr);gap:8px}
  .crail{position:static;max-height:none;gap:14px;margin-top:22px}
  .chd{display:block;margin:12px 0 0;font-family:var(--f-display);font-weight:400;font-size:clamp(34px,6vw,46px);line-height:1}
  .cnew{display:inline-flex;justify-self:start;align-self:flex-start;height:54px;padding:0 24px 0 20px;font-size:16px}
  .cnew svg{width:20px;height:20px}
  .ccomp{display:none}
  .clist{overflow:visible;padding:0}
}


/* =========================================================
   FINAL CREATIVES
   periodi → galerija (4:5 kadrovi) → pozornica u punom kvalitetu + komentari
   ========================================================= */
.rapp.cr-gal .rmain,.rapp.cr-gal .rtop-in{width:min(1240px,100%)}
.glist{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:clamp(22px,2.6vw,36px) clamp(14px,1.8vw,24px)}
.gli{min-width:0}
.gcard{display:grid;gap:16px;width:100%;text-align:left;--mx:50%;--my:50%;-webkit-tap-highlight-color:transparent}
.gframe{position:relative;display:block;aspect-ratio:3/4;border-radius:26px;overflow:hidden;isolation:isolate;
  background:radial-gradient(90% 70% at 80% 0%,rgba(227,169,174,.18),transparent 60%),linear-gradient(160deg,#2a1520,#150a0f);
  box-shadow:0 34px 70px -42px #000,0 0 0 1px rgba(240,190,198,.12);transition:transform .7s var(--spring),box-shadow .5s}
.gpos,.gvid{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.gpos{transition:transform 1.4s var(--ease),filter .6s}
.gvid{opacity:0;transition:opacity .45s}
.gcard.playing .gvid{opacity:1}
.gnone{position:absolute;inset:0;display:grid;place-items:center;color:rgba(240,190,198,.35)}
.gnone svg{width:42px;height:42px}
.gframe::after{content:"";position:absolute;inset:0;z-index:2;pointer-events:none;border-radius:inherit;
  background:radial-gradient(460px circle at var(--mx) var(--my),rgba(251,228,223,.16),transparent 45%),linear-gradient(180deg,transparent 60%,rgba(12,6,9,.35));opacity:0;transition:opacity .4s}
.gcard:hover .gframe{transform:translateY(-8px);box-shadow:0 56px 90px -44px #000,0 0 0 1px rgba(240,190,198,.34),0 0 80px -30px rgba(227,169,174,.55)}
.gcard:hover .gframe::after{opacity:1}
.gcard:hover .gpos{transform:scale(1.045)}
.gcard:active .gframe{transform:translateY(-2px) scale(.985)}
.gk{position:absolute;z-index:3;right:16px;top:16px;display:grid;place-items:center;color:#fff;filter:drop-shadow(0 1px 8px rgba(0,0,0,.6));transition:opacity .35s,transform .45s var(--spring)}
.gk svg{width:22px;height:22px}
.gcard.playing .gk{opacity:0;transform:scale(.7)}
.gtitle{padding:0 6px;font-family:var(--f-display);font-size:clamp(22px,1.9vw,27px);line-height:1.14;letter-spacing:-.005em;overflow-wrap:anywhere;transition:transform .55s var(--spring)}
.gcard:hover .gtitle{transform:translateX(4px)}
.gscan{position:absolute;z-index:4;left:-4%;right:-4%;top:0;height:2px;margin-top:-1px;opacity:0;pointer-events:none;
  background:linear-gradient(90deg,transparent,#fff 14%,#ffd9bd 50%,#fff 86%,transparent);box-shadow:0 0 16px 3px rgba(255,214,206,.95),0 0 46px 10px rgba(240,138,46,.5)}
.v-gal.enter .gli,.gli.fresh{animation:gin .9s var(--ease) both;animation-delay:calc(.25s + var(--i) * .09s)}
.v-gal.enter .gframe,.gli.fresh .gframe{animation:gdev 1.1s cubic-bezier(.65,0,.25,1) both;animation-delay:calc(.35s + var(--i) * .09s)}
.v-gal.enter .gscan,.gli.fresh .gscan{animation:gscan 1.1s cubic-bezier(.65,0,.25,1) both;animation-delay:calc(.35s + var(--i) * .09s)}
.v-gal.enter .gtitle,.gli.fresh .gtitle{animation:tlin .8s var(--ease) both;animation-delay:calc(.9s + var(--i) * .09s)}
.gli.fresh{animation-delay:0s}.gli.fresh .gframe,.gli.fresh .gscan{animation-delay:.1s}.gli.fresh .gtitle{animation-delay:.6s}
@keyframes gin{from{opacity:0;translate:0 30px}to{opacity:1;translate:0 0}}
@keyframes gdev{from{clip-path:inset(0 0 100% 0 round 26px);filter:brightness(1.8)}70%{filter:brightness(1.1)}to{clip-path:inset(0 0 0 0 round 26px);filter:none}}
@keyframes gscan{0%{top:0;opacity:1}88%{opacity:1}100%{top:100%;opacity:0}}
.gcard.land .gframe{animation:land 1s ease-out}

/* pozornica */
.th{position:fixed;inset:0;z-index:58;color:var(--cream)}
.th-amb{position:absolute;inset:0;overflow:hidden;opacity:0;transition:opacity .6s ease;background:#0c0608}
.th-amb canvas{position:absolute;left:-8%;top:-8%;width:116%;height:116%;max-width:none;filter:saturate(1.5);transition:opacity .45s}
.th-amb.swap canvas{opacity:.3}
.th-scrim{position:absolute;inset:0;opacity:0;transition:opacity .5s ease;
  background:radial-gradient(70% 75% at 37% 50%,rgba(12,6,9,.25),rgba(12,6,9,.82) 72%,rgba(10,5,7,.95)),linear-gradient(180deg,rgba(10,5,7,.5),transparent 16%,transparent 84%,rgba(10,5,7,.55))}
.th.on .th-amb,.th.on .th-scrim{opacity:1}
.th-in{position:relative;height:100%;display:grid;grid-template-rows:auto minmax(0,1fr);outline:none}
.th-top{display:flex;align-items:center;gap:16px;padding:16px clamp(16px,2.6vw,30px);opacity:0;transform:translateY(-12px);transition:opacity .4s .12s,transform .55s .12s var(--ease)}
.th.on .th-top{opacity:1;transform:none}
.th-brand{display:flex;align-items:center;gap:14px}
.th-brand img{width:36px;height:36px;filter:drop-shadow(0 0 14px rgba(227,169,174,.45))}
.th-x2{position:relative;width:12px;height:12px}
.th-x2::before,.th-x2::after{content:"";position:absolute;left:50%;top:0;bottom:0;width:1.5px;margin-left:-.75px;background:rgba(251,228,223,.45);transform:rotate(45deg)}
.th-x2::after{transform:rotate(-45deg)}
.th-wm{display:block;height:22px;aspect-ratio:520/177;background:var(--wm) center/contain no-repeat}
.th-pg{margin-left:auto;margin-right:6px;display:flex;align-items:center;gap:2px}
.th-count{font-size:14px;letter-spacing:.16em;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.th-pb{display:none}
.th-close{flex:none;width:50px;height:50px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.06);border:1px solid rgba(240,190,198,.24);transition:background .3s,color .3s,transform .5s var(--spring)}
.th-close svg{width:20px;height:20px}
.th-close:hover{background:var(--metal);background-size:200% 100%;color:#2a1218;border-color:transparent;transform:rotate(90deg)}
.th-body{display:grid;grid-template-columns:minmax(0,1fr) 384px;min-height:0}
.th-stage{position:relative;display:grid;place-items:center;min-height:0;min-width:0;padding:4px 96px 32px;touch-action:pan-y}
.th-media{position:relative;border-radius:24px;overflow:hidden;background:#0d0709;box-shadow:0 80px 140px -50px #000,0 0 0 1px rgba(240,190,198,.16);opacity:0;transition:opacity .3s,transform .5s var(--ease),filter .35s}
.th-media.in{opacity:1}
.th-media.go-l{transform:translateX(-80px) scale(.96);opacity:0;filter:blur(14px)}
.th-media.go-r{transform:translateX(80px) scale(.96);opacity:0;filter:blur(14px)}
.th-media.from-l{transform:translateX(-80px) scale(.96);opacity:0;filter:blur(14px);transition:none}
.th-media.from-r{transform:translateX(80px) scale(.96);opacity:0;filter:blur(14px);transition:none}
.th-media .im{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;display:block;user-select:none}
.th-ghost{position:fixed;z-index:59;background:#0d0709 center/cover no-repeat;box-shadow:0 70px 130px -50px #000,0 0 0 1px rgba(240,190,198,.18);pointer-events:none;will-change:left,top,width,height}
.th-nav{position:absolute;top:50%;z-index:2;width:58px;height:58px;margin-top:-29px;border-radius:50%;display:grid;place-items:center;color:var(--cream);background:rgba(255,255,255,.05);border:1px solid rgba(240,190,198,.22);transition:background .3s,color .3s,opacity .3s,transform .5s var(--spring)}
.th-nav svg{width:22px;height:22px}
.th-nav.prev{left:20px}.th-nav.next{right:20px}
.th-nav:hover:not(:disabled){background:var(--metal);background-size:200% 100%;color:#2a1218;border-color:transparent}
.th-nav.prev:hover:not(:disabled){transform:translateX(-3px)}.th-nav.next:hover:not(:disabled){transform:translateX(3px)}
.th-nav:disabled{opacity:0;pointer-events:none}
.th-side{display:flex;flex-direction:column;gap:16px;min-height:0;padding:4px clamp(16px,2.6vw,30px) 28px 0;opacity:0;transform:translateX(30px);transition:opacity .5s .2s,transform .7s .2s var(--ease)}
.th.on .th-side{opacity:1;transform:none}
.th-title{margin:0;font-family:var(--f-display);font-weight:400;font-size:clamp(30px,2.6vw,42px);line-height:1.06;letter-spacing:-.01em;overflow-wrap:anywhere}
.th-comp{flex:none}
.th-list{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding:2px 4px 12px 2px}
.th.on .th-list .cc{animation:ccrow .7s var(--ease) both;animation-delay:calc(.45s + var(--i) * .08s)}
.cchip{justify-self:start;display:inline-flex;align-items:center;gap:7px;height:32px;padding:0 13px 0 10px;border-radius:999px;background:rgba(240,138,46,.12);border:1px solid rgba(240,138,46,.38);color:#ffc69a;font-size:13.5px;font-weight:600;font-variant-numeric:tabular-nums;transition:background .25s,color .25s}
.cchip svg{width:12px;height:12px}
.cchip:hover{background:rgba(240,138,46,.22);color:#fff}
.cform[data-cr] .cqt{font-family:var(--f-body);font-style:normal;font-size:14px;font-weight:600;letter-spacing:.04em;color:#ffc69a;-webkit-line-clamp:1}
.cform[data-cr] .cq{align-items:center;padding:6px 6px 6px 14px}
/* plejer */
.vp{position:absolute;inset:0;user-select:none}
.vp video{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;display:block;background:#0d0709;cursor:pointer}
.vp-big{position:absolute;left:50%;top:50%;z-index:2;width:96px;height:96px;margin:-48px 0 0 -48px;border-radius:50%;display:grid;place-items:center;background:var(--metal);background-size:200% 100%;color:#2a1218;box-shadow:0 24px 60px -14px rgba(212,145,155,.9);transition:opacity .35s,transform .5s var(--spring)}
.vp-big svg{width:36px;height:36px;margin-left:5px}
.vp-big::before,.vp-big::after{content:"";position:absolute;inset:-2px;border-radius:50%;border:2px solid rgba(251,228,223,.8);animation:ring 2.4s ease-out infinite}
.vp-big::after{animation-delay:1.2s}
.vp.playing .vp-big{opacity:0;transform:scale(.6);pointer-events:none}
.vp-ctl{position:absolute;left:0;right:0;bottom:0;z-index:2;display:flex;align-items:center;gap:10px;padding:46px 14px 12px;background:linear-gradient(180deg,transparent,rgba(10,5,7,.78));transition:opacity .4s}
.vp.playing:not(.awake):not(.scrubbing) .vp-ctl{opacity:0}
.vp-pp,.vp-mute{flex:none;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:#fbe4df;transition:background .25s}
.vp-pp:hover,.vp-mute:hover{background:rgba(255,255,255,.1)}
.vp-pp svg,.vp-mute svg{width:20px;height:20px}
.vp-pp .i-pause,.vp.playing .vp-pp .i-play{display:none}
.vp.playing .vp-pp .i-pause{display:block}
.vp-mute .i-mute,.vp.muted .vp-mute .i-vol{display:none}
.vp.muted .vp-mute .i-mute{display:block}
.vp-scrub{position:relative;flex:1;height:30px;cursor:pointer;touch-action:none}
.vp-scrub::before{content:"";position:absolute;left:0;right:0;top:50%;height:3px;margin-top:-1.5px;border-radius:3px;background:rgba(255,255,255,.18)}
.vp-buf,.vp-fill{position:absolute;left:0;right:0;top:50%;height:3px;margin-top:-1.5px;border-radius:3px;transform-origin:left;transform:scaleX(0)}
.vp-buf{background:rgba(255,255,255,.22)}
.vp-fill{background:linear-gradient(90deg,var(--rose-3),var(--rose-2) 60%,var(--rose-1));box-shadow:0 0 12px rgba(227,169,174,.6)}
.vp-scrub:hover .vp-fill,.vp.scrubbing .vp-fill{height:5px;margin-top:-2.5px}
.vp-knob{position:absolute;top:50%;width:14px;height:14px;margin:-7px 0 0 -7px;border-radius:50%;background:#fff;box-shadow:0 0 0 4px rgba(240,138,46,.22),0 0 16px rgba(240,138,46,.85);transition:transform .3s var(--spring)}
.vp-scrub:hover .vp-knob,.vp.scrubbing .vp-knob{transform:scale(1.25)}
.vp-marks i{position:absolute;top:50%;width:9px;height:9px;margin:-4.5px 0 0 -4.5px;border-radius:50%;background:var(--sky);box-shadow:0 0 0 3px rgba(240,138,46,.25),0 0 10px rgba(240,138,46,.8);pointer-events:none}
.vp-time{flex:none;font-size:13px;color:rgba(247,233,232,.8);font-variant-numeric:tabular-nums;white-space:nowrap}
.vp-time b{font-weight:500;color:#fff}
/* karusel */
.cs{position:absolute;inset:0;overflow:hidden;touch-action:pan-y;user-select:none;cursor:grab}
.cs:active{cursor:grabbing}
.cs-track{display:flex;height:100%;transition:transform .6s cubic-bezier(.65,0,.25,1)}
.cs-track img{flex:0 0 100%;width:100%;height:100%;object-fit:contain;display:block;-webkit-user-drag:none;pointer-events:none}
.cs-a{position:absolute;top:50%;z-index:2;width:36px;height:36px;margin-top:-18px;border-radius:50%;display:grid;place-items:center;color:#1c0e14;background:rgba(255,255,255,.86);box-shadow:0 6px 18px -4px rgba(0,0,0,.5);transition:opacity .3s,background .25s,transform .4s var(--spring)}
.cs-a svg{width:17px;height:17px}
.cs-a:hover{background:#fff;transform:scale(1.08)}
.cs-a.prev{left:14px}.cs-a.next{right:14px}
.cs.first .cs-a.prev,.cs.last .cs-a.next{opacity:0;pointer-events:none}

.ci-line{position:absolute;left:0;right:0;top:50%;height:2px;margin-top:-1px;transform:scaleX(0);opacity:0;
  background:linear-gradient(90deg,transparent,#fff 18%,#ffd9bd 50%,#fff 82%,transparent);box-shadow:0 0 18px 4px rgba(255,214,206,.95),0 0 70px 16px rgba(240,138,46,.5)}

@keyframes ciup{to{opacity:1;transform:none}}
@keyframes cidown{to{opacity:1;transform:none;filter:none}}

@keyframes ciflash{0%{opacity:1;transform:scaleX(1) scaleY(1)}30%{opacity:1;transform:scaleX(1) scaleY(3)}100%{opacity:0;transform:scaleX(1) scaleY(1)}}

.pv-e svg{width:17px;height:17px}

.pv-r{display:grid;grid-template-columns:minmax(0,1fr) auto;grid-template-areas:"k k" "v b";align-items:center;gap:6px 8px;padding:12px 8px 12px 16px;border-radius:18px;background:rgba(0,0,0,.22);border:1px solid rgba(240,190,198,.08)}
.pv-r.pw{grid-template-columns:minmax(0,1fr) auto auto;grid-template-areas:"k k k" "v e b"}
.pv-k{grid-area:k;font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.pv-v{grid-area:v;min-width:0;font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;font-size:16.5px;color:#fff;overflow-wrap:anywhere;user-select:all}
.pv-v.hid{letter-spacing:.18em;color:rgba(247,233,232,.75);user-select:none}
.pv-ey{grid-area:e}.pv-cp{grid-area:b}
.pv-ey,.pv-cp{position:relative;width:46px;height:46px;border-radius:14px;display:grid;place-items:center;color:var(--rose-1);background:rgba(251,228,223,.07);border:1px solid rgba(240,190,198,.18);transition:background .25s,color .25s,transform .35s var(--spring)}
.pv-ey svg,.pv-cp svg{width:19px;height:19px}
.pv-cp:hover{background:var(--metal);background-size:200% 100%;color:#2a1218;border-color:transparent}
.pv-ey:hover{background:rgba(251,228,223,.14);color:#fff}
.pv-cp:active{transform:scale(.92)}
.pv-cp i{position:absolute;inset:-1px;border-radius:inherit;display:grid;place-items:center;background:#3ec27c;color:#fff;opacity:0;transform:scale(.6);transition:opacity .2s,transform .35s var(--spring)}
.pv-cp.ok i{opacity:1;transform:none}
.pv-n{margin:0;font-size:14.5px;line-height:1.5;color:rgba(247,233,232,.72)}
.pv-none{color:var(--muted);font-size:17px;padding:20px 4px}
/* prozor za dodavanje / izmenu */
.pv-sheet{position:fixed;inset:0;z-index:70;display:grid;place-items:center;padding:16px}
.pv-scr{position:absolute;inset:0;background:rgba(10,5,7,.7);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);opacity:0;transition:opacity .25s}
.pv-box{position:relative;width:min(560px,100%);max-height:calc(100% - 8px);overflow-y:auto;display:grid;gap:16px;padding:28px;border-radius:30px;background:linear-gradient(170deg,#2a1820,#1c0f15);border:1px solid rgba(240,190,198,.18);box-shadow:0 50px 100px -30px #000;opacity:0;transform:translateY(24px) scale(.97);transition:opacity .25s,transform .45s var(--spring)}
.pv-sheet.on .pv-scr{opacity:1}
.pv-sheet.on .pv-box{opacity:1;transform:none}
.pv-box h3{margin:0 0 2px;font-family:var(--f-display);font-weight:400;font-size:32px}
.pv-pl{display:flex;flex-wrap:wrap;gap:7px}
.pv-pl button{height:38px;padding:0 14px;border-radius:999px;border:1px solid rgba(240,190,198,.2);font-size:14px;color:rgba(247,233,232,.85)}
.pv-pl button[aria-checked=true]{background:var(--metal);background-size:200% 100%;color:#2a1218;border-color:transparent;font-weight:600}
.pv-in{display:grid;gap:7px}
.pv-in>span:first-child{font-size:13px;font-weight:600;letter-spacing:.04em;color:var(--muted)}
.pv-in em{font-style:normal;font-weight:400;opacity:.75}
.pv-in input{width:100%;height:52px;padding:0 16px;border-radius:16px;border:1px solid rgba(240,190,198,.2);background:rgba(0,0,0,.25);color:var(--cream);font:inherit;font-size:16px;outline:0;transition:border-color .2s,box-shadow .2s}
.pv-in input:focus{border-color:rgba(240,190,198,.55);box-shadow:0 0 0 4px rgba(227,169,174,.12)}
.pv-pw{position:relative;display:block}
.pv-pw input{padding-right:56px;font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace}
.pv-pw button{position:absolute;right:6px;top:6px;width:40px;height:40px;border-radius:12px;display:grid;place-items:center;color:var(--rose-1)}
.pv-pw button svg{width:19px;height:19px}
.pv-act{display:flex;align-items:center;gap:10px;margin-top:6px}
.pv-act .pill{height:50px;padding:0 22px}
.pv-act .pill:first-of-type{margin-left:auto}
.pv-del{height:44px;padding:0 6px;color:#ff8f86;font-size:15px;font-weight:600}
@media (max-width:760px){

  .pv-f button{flex:none}
}

/* =========================================================
   SKRIPTA NA PAPIRU: sveska sa linijama, rukopis koji se lako čita
   ========================================================= */
.paper{--L:36px;--ink:#26305e;--red:#c0485a;--rule:rgba(76,108,178,.24);--mx:84px;transform:rotate(-.35deg);transform-origin:50% 0}
.psheet{border-radius:5px;color:var(--ink);padding:calc(var(--L) * 2) clamp(24px,4vw,56px) calc(var(--L) * 2) calc(var(--mx) + 22px);
  background:
    linear-gradient(90deg,transparent calc(var(--mx) - 1px),rgba(208,92,104,.5) calc(var(--mx) - 1px),rgba(208,92,104,.5) calc(var(--mx) + .5px),transparent calc(var(--mx) + .5px)) 0 0/100% 100% no-repeat,
    linear-gradient(180deg,transparent calc(var(--L) - 1px),var(--rule) calc(var(--L) - 1px),var(--rule) var(--L)) 0 var(--ry,-4px)/100% var(--L) repeat-y,
    radial-gradient(120% 60% at 100% 0%,rgba(255,255,255,.75),transparent 60%),
    linear-gradient(178deg,#fdfbf6,#f4efe5);
  box-shadow:0 60px 110px -60px #000,0 26px 50px -36px rgba(0,0,0,.85),inset 0 0 0 1px rgba(255,255,255,.6),inset 0 0 60px rgba(150,120,90,.06)}
.psheet::before{content:"";position:absolute;left:50%;top:-16px;width:170px;height:38px;margin-left:-85px;z-index:2;transform:rotate(-2deg);
  background:linear-gradient(180deg,rgba(236,190,196,.82),rgba(219,160,168,.78));box-shadow:0 2px 6px rgba(80,30,40,.18);
  clip-path:polygon(2% 0,98% 3%,100% 22%,97% 40%,100% 62%,98% 100%,3% 97%,0 78%,3% 56%,0 34%,2% 14%)}
.pbody{font-family:"Kalam","Segoe Print","Comic Sans MS",cursive;font-size:21px;line-height:var(--L);color:var(--ink);letter-spacing:.005em}
.pbody h1,.pbody h2,.pbody h3{font-family:"Kalam","Segoe Print",cursive;font-weight:700;color:var(--ink);line-height:var(--L);letter-spacing:0;margin:var(--L) 0 0;
  text-decoration:underline;text-decoration-color:var(--red);text-decoration-thickness:2.5px;text-underline-offset:7px;text-decoration-skip-ink:none}
.pbody h1{font-size:31px}.pbody h2{font-size:27px}.pbody h3{font-size:24px;text-decoration-thickness:2px}
.pbody>*:first-child{margin-top:0}
.pbody p{margin:0 0 var(--L)}
.pbody h1+p,.pbody h2+p,.pbody h3+p,.pbody h1+ul,.pbody h2+ul,.pbody h3+ul,.pbody h1+ol,.pbody h2+ol,.pbody h3+ol{margin-top:0}
.pbody .grey{color:#7d84a8;font-style:normal}
.pbody b,.pbody strong{font-weight:700;color:#1b2350}
.pbody em,.pbody i{color:var(--red);font-style:normal}
.pbody ul,.pbody ol{margin:0 0 var(--L);padding-left:1.25em}
.pbody li{margin:0;padding-left:.15em}
.pbody li::marker{color:var(--red)}
.pbody blockquote{margin:0 0 var(--L);padding:0 0 0 1em;border-left:2px solid var(--red);color:#47507c;font-style:normal}
.pbody hr{border:0;height:var(--L);margin:0;background:linear-gradient(90deg,transparent,var(--ink) 8%,var(--ink) 92%,transparent) 0 55%/100% 2px no-repeat;opacity:.55}
.pbody table{font-family:var(--f-body);color:#2e2a3a}
.pbody .pfile{font-family:var(--f-body)}
.pbody ::selection{background:rgba(240,138,46,.32);color:#141a3d}
.pbody mark.hl{background:linear-gradient(rgba(240,170,180,.5),rgba(240,170,180,.5)) 0 0/100% 100% no-repeat;box-shadow:inset 0 -2px 0 var(--red)}
.pempty{color:#6c7398}
.pempty b{font-family:"Kalam",cursive;font-weight:700;color:var(--ink)}
.pempty .ric{background:#e9ecf7;color:var(--ink)}
@media (max-width:760px){
  .paper{--L:33px;--mx:30px;--ry:0px;transform:none}
  .psheet{border-radius:4px;padding:calc(var(--L) * 2) 18px var(--L) calc(var(--mx) + 14px)}
  .psheet::before{width:130px;margin-left:-65px;height:32px;top:-13px}
  .pbody{font-size:19px;line-height:var(--L)}
  .pbody h1{font-size:27px}.pbody h2{font-size:24px}.pbody h3{font-size:21px}
}

/* ---------- ambient: rose arcs, drifting dust that moves away from the cursor, faint laser sweeps ---------- */
(function(){
  const c=$("#bg"),x=c.getContext("2d");let W,H,parts=[],beams=[],nb=performance.now()+4200,t0=performance.now(),sy=0;
  function size(){const d=Math.min(1.5,devicePixelRatio||1);W=innerWidth;H=innerHeight;c.width=W*d;c.height=H*d;x.setTransform(d,0,0,d,0,0);
    const n=Math.round(Math.min(90,W*H/16000));parts=Array.from({length:n},()=>({x:Math.random()*W,y:Math.random()*H,vx:0,vy:0,r:.4+Math.random()*1.5,v:.08+Math.random()*.28,p:Math.random()*6.28}))}
  size();addEventListener("resize",size);addEventListener("scroll",()=>{sy=scrollY},{passive:true});
  const arcs=[{cx:-.15,cy:-.1,R:.75,w:1.2,s:.00004,o:.16},{cx:1.12,cy:1.15,R:.62,w:1.2,s:-.00005,o:.14},{cx:-.25,cy:-.25,R:1.05,w:.8,s:.00003,o:.08},{cx:1.25,cy:1.3,R:.9,w:.8,s:-.00003,o:.07}];
  function frame(now){
    const t=now-t0,m=Math.max(W,H);x.clearRect(0,0,W,H);
    arcs.forEach((a,i)=>{
      const cx=a.cx*W+Math.sin(t*a.s*6+i)*24,cy=a.cy*H+Math.cos(t*a.s*5+i)*24-sy*.05*(i%2?-1:1),Rr=a.R*m;
      const g=x.createRadialGradient(cx,cy,Rr*.92,cx,cy,Rr*1.08);g.addColorStop(0,"rgba(227,169,174,0)");g.addColorStop(.5,`rgba(240,196,200,${a.o})`);g.addColorStop(1,"rgba(227,169,174,0)");
      x.strokeStyle=g;x.lineWidth=Rr*.16;x.beginPath();x.arc(cx,cy,Rr,0,Math.PI*2);x.stroke();
      x.strokeStyle=`rgba(251,228,223,${a.o*1.6})`;x.lineWidth=a.w;x.beginPath();x.arc(cx,cy,Rr,0,Math.PI*2);x.stroke();
    });
    if(!reduce&&now>nb){beams.push({t:now,d:1700,y0:H*(.15+Math.random()*.7),ang:(Math.random()-.5)*.6,dir:Math.random()<.5?1:-1});nb=now+7000+Math.random()*6000}
    beams=beams.filter(b=>now-b.t<b.d);
    for(const b of beams){
      const k=(now-b.t)/b.d,env=Math.sin(Math.PI*k),x0=-60,x1=W+60,yA=b.y0-Math.tan(b.ang)*W/2,yB=b.y0+Math.tan(b.ang)*W/2,len=Math.hypot(x1-x0,yB-yA),ux=(x1-x0)/len,uy=(yB-yA)/len;
      x.strokeStyle=`rgba(251,228,223,${(.05*env).toFixed(3)})`;x.lineWidth=1;x.beginPath();x.moveTo(x0,yA);x.lineTo(x1,yB);x.stroke();
      const u=b.dir>0?k:1-k,px=x0+(x1-x0)*u,py=yA+(yB-yA)*u,tx=px-ux*220*b.dir,ty=py-uy*220*b.dir;
      const lg=x.createLinearGradient(tx,ty,px,py);lg.addColorStop(0,"rgba(255,240,232,0)");lg.addColorStop(1,`rgba(255,240,232,${(.55*env).toFixed(3)})`);
      x.strokeStyle=lg;x.lineWidth=1.6;x.beginPath();x.moveTo(tx,ty);x.lineTo(px,py);x.stroke();
      const rg=x.createRadialGradient(px,py,0,px,py,46);rg.addColorStop(0,`rgba(255,240,232,${(.35*env).toFixed(3)})`);rg.addColorStop(1,"rgba(255,240,232,0)");x.fillStyle=rg;x.beginPath();x.arc(px,py,46,0,6.283);x.fill();
    }
    for(const p of parts){
      if(!reduce){p.y-=p.v;p.x+=Math.sin(t/2400+p.p)*.12;
        if(PTR.in){const dx=p.x-PTR.x,dy=p.y-PTR.y,d2=dx*dx+dy*dy;if(d2<18000){const d=Math.sqrt(d2)||1,f=(1-d/134)*1.5;p.vx+=dx/d*f;p.vy+=dy/d*f}}
        p.x+=p.vx;p.y+=p.vy;p.vx*=.9;p.vy*=.9;if(p.y<-5){p.y=H+5;p.x=Math.random()*W}if(p.x<-5)p.x=W+5;else if(p.x>W+5)p.x=-5}
      const a=.25+.35*Math.sin(t/900+p.p);x.fillStyle=`rgba(251,228,223,${Math.max(0,a).toFixed(3)})`;x.beginPath();x.arc(p.x,p.y,p.r,0,6.283);x.fill();
    }
    if(!reduce)requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();

/* ---------- spotlight + cursor ring ---------- */
(function(){
  const spot=$("#spot"),cu=$("#cur");
  if(!fine){spot.style.opacity=".6";cu.remove();return}
  let sx=PTR.x,sy=PTR.y,cx=PTR.x,cy=PTR.y;
  (function f(){sx+=(PTR.x-sx)*.08;sy+=(PTR.y-sy)*.08;cx+=(PTR.x-cx)*.24;cy+=(PTR.y-cy)*.24;

  function updScript(){

  function paintBody(s){
    const b=$("#pbody");if(!b)return;
    const html=bodyOf(s);bodySig=sigOf(s);deferBody=false;
    b.innerHTML=html||`<div class="pempty"><span class="ric" aria-hidden="true">${I_PEN}</span><b>Tekst stiže uskoro</b></div>`;
    ANCH=new Map();
    const fresh=[];
    (ST.byS.get(s.id)||[]).slice().reverse().forEach(c=>{
      if(c.resolved||!c.quote)return;
      const r=findRange(b,c.quote,c.before,c.after);if(!r)return;
      const ms=wrapRange(r,b,c.id,"hl");if(!ms.length)return;
      ANCH.set(c.id,ms);if(ST.cfresh.has(c.id)&&!ST.burnt.has(c.id)){ST.burnt.add(c.id);fresh.push(ms)}
    });
    markPending();
    fresh.forEach(burn);
  }
  /* citat se traži bez razmaka, pa ga ne kvare prelomi redova; tekst oko citata razrešava ponavljanja */
  function findRange(root,quote,before,after){
    const q=squash(quote);if(!q)return null;
    const map=[];let hay="";
    const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT);let n;
    while((n=w.nextNode())){const d=n.data;for(let i=0;i<d.length;i++){if(/\s/.test(d[i]))continue;hay+=d[i];map.push([n,i])}}
    const b=squash(before).slice(-24),a=squash(after).slice(0,24);let at=-1,k;
    if(b&&a&&(k=hay.indexOf(b+q+a))>=0)at=k+b.length;
    if(at<0&&b&&(k=hay.indexOf(b+q))>=0)at=k+b.length;
    if(at<0&&a&&(k=hay.indexOf(q+a))>=0)at=k;
    if(at<0)at=hay.indexOf(q);
    if(at<0)return null;
    const s=map[at],e=map[at+q.length-1],r=document.createRange();
    r.setStart(s[0],s[1]);r.setEnd(e[0],e[1]+1);return r;
  }
  function wrapRange(r,root,cid,cls){
    const sc=r.startContainer,so=r.startOffset,ec=r.endContainer,eo=r.endOffset,list=[],out=[];
    const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT);let n;
    while((n=w.nextNode()))if(r.intersectsNode(n))list.push(n);
    list.forEach(t=>{
      const s=t===sc?so:0,e=t===ec?eo:t.data.length;if(e<=s)return;
      let mid=t;if(s>0)mid=t.splitText(s);if(e-s<mid.data.length)mid.splitText(e-s);
      if(!mid.data.trim())return;
      const m=document.createElement("mark");m.className=cls;if(cid)m.dataset.cid=cid;
      mid.parentNode.insertBefore(m,mid);m.appendChild(mid);out.push(m);
    });
    return out;
  }
  /* novi komentar: laser "izgori" podvlaku preko citata */
  function burn(ms){
    if(reduce)return;
    const segs=ms.map(m=>({m,w:[...m.getClientRects()].reduce((a,r)=>a+r.width,0)})),tot=segs.reduce((a,x)=>a+x.w,0)||1,T=.9;let acc=0;
    segs.forEach(x=>{x.m.style.animationDelay=(acc/tot*T).toFixed(3)+"s";x.m.style.animationDuration=Math.max(.12,x.w/tot*T).toFixed(3)+"s";x.m.classList.add("burn");acc+=x.w});
    setTimeout(()=>ms.forEach(m=>{m.classList.remove("burn");m.style.animationDelay="";m.style.animationDuration=""}),T*1000+200);
    const rects=ms.flatMap(m=>[...m.getClientRects()]).filter(r=>r.width>2),t0=performance.now();
    (function step(now){
      const k=Math.min(1,(now-t0)/(T*1000));let d=k*tot;
      for(const r of rects){if(d<=r.width){FX.sparks(r.left+d,r.bottom-3,3,true);break}d-=r.width}
      if(k<1)requestAnimationFrame(step);
    })(t0);
