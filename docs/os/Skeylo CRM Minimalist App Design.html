    const t=$("#toast"),b=$("#toastGo");$("#toastMsg").textContent=msg;toastAct=act||null;
    b.hidden=!act;if(act)b.textContent=act.label||"Pogledaj";
    t.classList.add("show");clearTimeout(toastTm);toastTm=setTimeout(()=>t.classList.remove("show"),act?6500:3200);
  }
  $("#toastGo").addEventListener("click",()=>{const a=toastAct;toastAct=null;$("#toast").classList.remove("show");if(a&&a.fn)a.fn()});

  /* ---------- klikovi ---------- */
  rmain.addEventListener("click",e=>{
    const m=e.target.closest("mark.hl[data-cid]");
    if(m&&rmain.contains(m)){const s=getSelection();if(!s||s.isCollapsed)focusCard(m.dataset.cid);return}
    const t=e.target.closest("button");if(!t||!rmain.contains(t))return;
    const d=t.dataset;
    if(d.oid&&cur.sec==="org"&&cur.v==="list"){if(e.clientX||e.clientY)FX.sparks(e.clientX,e.clientY,20,true);navTo({sec:"org",v:"day",oid:d.oid},t);return}
    if(t.hasAttribute("data-olines")){const l=t.nextElementSibling,o=l.hidden;l.hidden=!o;t.setAttribute("aria-expanded",String(o));return}
    if((e.clientX||e.clientY)&&(d.pid||d.type||d.rid||d.sid||d.crid))FX.sparks(e.clientX,e.clientY,20,true);
    if(d.pid&&cur.v==="periods")navTo(cur.sec==="ci"?{sec:"ci",v:"scripts",pid:d.pid}:cur.sec==="cr"?{sec:"cr",v:"gallery",pid:d.pid}:{sec:"rep",v:"types",pid:d.pid},t);
    else if(d.crid&&cur.v==="gallery")navTo({sec:"cr",v:"gallery",pid:cur.pid,cid:d.crid},t);
    else if(d.type&&cur.v==="types")navTo({sec:"rep",v:"list",pid:cur.pid,type:d.type},t);
    else if(d.rid&&cur.v==="list"&&!isViewer(cur))navTo({sec:"rep",v:"list",pid:cur.pid,type:cur.type,rid:d.rid},t);
    else if(d.sid&&cur.v==="scripts")navTo({sec:"ci",v:"script",pid:cur.pid,sid:d.sid},t);
    else if(d.sw&&cur.v==="list")swapTo({sec:"rep",v:"list",pid:cur.pid,type:d.sw});
    else if(d.loomOf){const r=ST.R.get(d.loomOf);if(r)navTo({sec:"rep",v:"list",pid:r.monthId,type:"loom",rid:r.id},null)}
    else if(d.jump)jumpTo(d.jump);
    else if(d.cdel)delComment(d.cdel);
    else if(t.hasAttribute("data-cnew")){CQ=null;clearPending();openComposer()}
    else if(t.hasAttribute("data-cqx")){CQ=null;clearPending();syncComposer();const f=t.closest("[data-cform]");f&&f.querySelector("[data-cta]").focus()}
    else if(t.hasAttribute("data-retry")){const r=ST.R.get(cur.rid),P=ST.P.get(cur.pid);if(r&&P){htmlCache.delete(r.id);vViewer(P,r.id,"update")}}
    else if(t.hasAttribute("data-up"))goBack();
  });
  if(fine){
    rmain.addEventListener("pointermove",e=>{
      const t=e.target.closest(".prow,.ritem,.sitem,.gcard");if(!t)return;const r=t.getBoundingClientRect();
      t.style.setProperty("--mx",(e.clientX-r.left).toFixed(0)+"px");t.style.setProperty("--my",(e.clientY-r.top).toFixed(0)+"px");
    },{passive:true});
    rmain.addEventListener("pointerover",e=>{if(cur.v==="gallery"){hoverCard(e.target.closest(".gcard"));return}if(cur.v!=="script")return;const x=e.target.closest("mark.hl[data-cid],.cc[data-cid]");lit(x?x.dataset.cid:null)});
    rmain.addEventListener("pointerleave",()=>{lit(null);hoverCard(null)});
  }
  /* sastavljanje komentara (u traci desno i u donjem prozoru na telefonu) */
  document.addEventListener("input",e=>{const ta=e.target.closest&&e.target.closest("[data-cta]");if(!ta)return;autoGrow(ta);syncComposer()});
  /* bez <form submit>: u zaštićenom okviru (sandbox bez allow-forms) submit se ne okida */
  document.addEventListener("submit",e=>{const f=e.target.closest&&e.target.closest("[data-cform]");if(f)e.preventDefault()});
  document.addEventListener("click",e=>{const b=e.target.closest&&e.target.closest("[data-csend]");if(b&&!b.disabled)sendFrom(b.closest("[data-cform]"))});
  document.addEventListener("keydown",e=>{
    if(e.key==="Enter"&&(e.metaKey||e.ctrlKey)){const ta=e.target.closest&&e.target.closest("[data-cta]");if(ta){e.preventDefault();sendFrom(ta.closest("[data-cform]"))}return}
    if(!th.hidden){
      const a=document.activeElement;if(e.altKey||e.ctrlKey||e.metaKey||(a&&a.matches&&a.matches("input,textarea,select,[contenteditable]")))return;
      if(e.key==="ArrowLeft"||e.key==="ArrowRight"){if(stepCreative(e.key==="ArrowRight"?1:-1))e.preventDefault()}
      else if(e.key===" "&&VP&&!(a&&a.tagName==="BUTTON")){e.preventDefault();togglePlay()}
      return;
    }
    if(rapp.hidden||cur.v!=="script"||e.altKey||e.ctrlKey||e.metaKey||e.shiftKey||(e.key!=="ArrowLeft"&&e.key!=="ArrowRight"))return;
    const a=document.activeElement;if(a&&a.matches&&a.matches("input,textarea,select,[contenteditable]"))return;
    if(!csheet.hidden||!lov.hidden)return;
    const s=getSelection();if(s&&!s.isCollapsed)return;
    if(stepScript(e.key==="ArrowRight"?1:-1))e.preventDefault();
  });
  rmain.addEventListener("focusin",e=>{const f=e.target.closest("#ccomp [data-cform]");if(f)f.classList.add("open")});
  rmain.addEventListener("focusout",e=>{const f=e.target.closest("#ccomp [data-cform]");if(!f)return;setTimeout(()=>{if(f.isConnected&&!f.contains(document.activeElement)&&!f.querySelector("[data-cta]").value.trim()&&!CQ)f.classList.remove("open")},150)});
  csheet.addEventListener("click",e=>{
    if(e.target.closest("[data-csx]")||e.target.id==="csScrim"){cancelSheet();return}
    if(e.target.closest("[data-cqx]")){CQ=null;clearPending();syncComposer();csheet.querySelector("[data-cta]").focus()}
  });
  WIDE.addEventListener&&WIDE.addEventListener("change",()=>{if(wide())closeSheet(true)});
  rsw.addEventListener("click",e=>{const b=e.target.closest("[data-sw]");if(!b||cur.v!=="list"||isViewer(cur)||b.dataset.sw===cur.type)return;swapTo({sec:"rep",v:"list",pid:cur.pid,type:b.dataset.sw})});
  rsw.addEventListener("keydown",e=>{
    if(e.key!=="ArrowLeft"&&e.key!=="ArrowRight")return;e.preventDefault();
    const t=cur.type==="loom"?"pisani":"loom";swapTo({sec:"rep",v:"list",pid:cur.pid,type:t});setTimeout(()=>$(t==="loom"?"#swLoom":"#swDoc").focus(),0);
  });
  $("#cprev").addEventListener("click",()=>stepScript(-1));
  $("#cnext").addEventListener("click",()=>stepScript(1));
  $("#rback").addEventListener("click",goBack);
  $("#lovX").addEventListener("click",goBack);
  $("#lovScrim").addEventListener("click",goBack);
  $("#lovActs").addEventListener("click",e=>{const b=e.target.closest("[data-doc-of]");if(!b)return;const r=ST.R.get(b.dataset.docOf);if(r)navTo({sec:"rep",v:"list",pid:r.monthId,type:"pisani",rid:r.id},lovScreen)});
  function onEsc(){
    if(document.querySelector(".pv-sheet")){pvClose();return true}
    if(!th.hidden){goBack();return true}
    if(!lov.hidden){goBack();return true}
    if(!csheet.hidden){cancelSheet();return true}
    if(CQ){CQ=null;clearPending();syncComposer();return true}
    return false;
  }

  /* ---------- start ---------- */
  cur=parse();if(cur.sec==="pv"&&!unlocked){cur={v:"dash"};try{location.hash=""}catch(e){}setTimeout(openVault,900)}curKey=keyOf(cur);
  if(cur.v!=="dash"){
    const first=()=>{render(cur,"enter");const nt=thOf(cur);if(nt)openTheater(nt,null)};
    if((cur.sec==="cr"||cur.sec==="org")&&!reduce){showApp();runIntro(first)}else first();
  }
  window.SkeyloCRM={
    connect(db,clientId,user){if(GUEST)return;if(clientId)CLIENT.id=clientId;if(user)CLIENT.user=Object.assign({},CLIENT.user,user);useSource(firestoreSource(db,CLIENT.id))},
    useSource,
    connectSchedule(db,id){useSource({demo:false,subscribe(cb,err){const empty={items:[],reports:[],scripts:[],comments:[],creatives:[],creativeComments:[]};setTimeout(()=>cb(empty),0);
      return db.doc("schedules/"+id).onSnapshot(s=>{const d=s.exists?s.data():null;if(d){CLIENT.id=d.clientId||CLIENT.id;cb({schedules:[{id:s.id,...d}]})}else cb({schedules:[]})},e=>err("schedules",e))}})},
    get state(){return ST}
  };
  if(CLIENT.data==="demo")useSource(GUEST?guestOnly(demoSource()):demoSource());
  return{open:card=>navTo({sec:"rep",v:"periods"},card),openCI:card=>navTo({sec:"ci",v:"periods"},card),openCR:card=>navTo({sec:"cr",v:"periods"},card),openOR:card=>navTo({sec:"org",v:"list"},card),openPV:card=>navTo({sec:"pv",v:"list"},card),back:goBack,esc:onEsc,overlayOpen:()=>!lov.hidden||!th.hidden};
})();

</script>
</body>
</html>
