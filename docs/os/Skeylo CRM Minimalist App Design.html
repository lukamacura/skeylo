<!doctype html>
<html lang="sr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Skeylo Platforma</title>
<meta name="theme-color" content="#140a0e">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Kalam:wght@400;700&family=Poppins:wght@400;500;600&display=swap">
<style>
/* =========================================================
   SKEYLO CRM · Client Dashboard
   Za novog klijenta: promeni CLIENT objekat (skripta na dnu)
   i boje ispod u :root. Ništa drugo ne treba dirati.
   ========================================================= */
:root{
  color-scheme:dark;
  --bg:#140a0e;--bg-2:#1c0f15;--bg-3:#26141c;
  --line:rgba(240,190,198,.12);
  --cream:#f7e9e8;--muted:#b89ea4;
  --rose-1:#fbe4df;--rose-2:#e3a9ae;--rose-3:#b8737d;--rose:#d4919b;
  --metal:linear-gradient(115deg,var(--rose-1) 0%,var(--rose-2) 34%,var(--rose-3) 58%,var(--rose-2) 78%,var(--rose-1) 100%);
  --sky:#f08a2e;            /* Skeylo narandžasta: laser */
  --f-display:"DM Serif Display",Georgia,"Times New Roman",serif;
  --f-body:"Poppins",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --ease:cubic-bezier(.2,.8,.2,1);
  --spring:cubic-bezier(.34,1.45,.64,1);
  --gut:clamp(16px,4vw,40px);
}
@property --a{syntax:"<angle>";inherits:false;initial-value:0deg}
@property --sp{syntax:"<percentage>";inherits:false;initial-value:-60%}
@property --p{syntax:"<percentage>";inherits:true;initial-value:-2%}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;overscroll-behavior-x:none}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--cream);font-family:var(--f-body);font-size:17px;line-height:1.5;-webkit-font-smoothing:antialiased;overflow-x:hidden}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:2px solid var(--rose-2);outline-offset:4px;border-radius:12px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
[hidden]{display:none!important}
::selection{background:rgba(227,169,174,.35);color:#fff}
.vin input::selection{background:rgba(235,235,240,.28);color:#fff}

/* ---------- ambient layers ---------- */
#bg{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
#fxf{position:fixed;inset:0;width:100%;height:100%;z-index:65;pointer-events:none}
.spot{position:fixed;left:0;top:0;width:900px;height:900px;margin:-450px 0 0 -450px;z-index:0;pointer-events:none;border-radius:50%;
  background:radial-gradient(closest-side,rgba(227,169,174,.10),rgba(227,169,174,.03) 50%,transparent);will-change:transform}
.grain{position:fixed;inset:-50%;z-index:1;pointer-events:none;opacity:.07;mix-blend-mode:overlay;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
  animation:grain 1.2s steps(6) infinite}
@keyframes grain{0%{transform:translate(0,0)}20%{transform:translate(-3%,2%)}40%{transform:translate(2%,-3%)}60%{transform:translate(-2%,-1%)}80%{transform:translate(3%,3%)}100%{transform:translate(0,0)}}
.flashall{position:fixed;inset:0;z-index:44;pointer-events:none;opacity:0;background:radial-gradient(circle at var(--fx,70%) var(--fy,30%),rgba(255,236,226,.32),rgba(240,138,46,.08) 22%,transparent 46%)}
.flashall.go{animation:fall .9s ease-out}
@keyframes fall{0%{opacity:0}10%{opacity:1}100%{opacity:0}}
.cur{position:fixed;left:0;top:0;z-index:70;width:34px;height:34px;margin:-17px 0 0 -17px;border-radius:50%;border:1.5px solid rgba(251,228,223,.5);pointer-events:none;opacity:0;
  transition:width .4s var(--spring),height .4s var(--spring),margin .4s var(--spring),background .3s,border-color .3s,opacity .3s;will-change:transform}
.cur.on{opacity:1}
.cur.big{width:86px;height:86px;margin:-43px 0 0 -43px;background:rgba(251,228,223,.05);border-color:rgba(251,228,223,.8)}
.cur.hot{width:56px;height:56px;margin:-28px 0 0 -28px;border-color:rgba(240,138,46,.9);background:rgba(240,138,46,.08)}
.cur.dn{width:22px;height:22px;margin:-11px 0 0 -11px}

.page{position:relative;z-index:2;overflow-x:clip}
body.jolt .page{animation:jolt .5s cubic-bezier(.3,1.5,.5,1)}
@keyframes jolt{15%{transform:translate(-7px,5px)}35%{transform:translate(6px,-4px)}55%{transform:translate(-3px,2px)}75%{transform:translate(2px,-1px)}100%{transform:none}}

/* ---------- top bar ---------- */
.top{width:min(1120px,100%);margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:calc(22px + env(safe-area-inset-top,0px)) var(--gut) 8px;animation:fadeIn .8s .15s both}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.top .wmk{display:block;height:30px;aspect-ratio:520/177;background:var(--wm) center/contain no-repeat}
.top .who{display:inline-flex;align-items:center;gap:10px;padding:5px 16px 5px 5px;border-radius:999px;background:rgba(255,255,255,.03);border:1px solid var(--line);font-size:15px;font-weight:500}
.top .who img{width:34px;height:34px;border-radius:50%;background:radial-gradient(#2a1520,#140a0e);padding:3px;border:1px solid rgba(240,190,198,.3)}

/* ---------- hero ---------- */
.hero{width:min(1120px,100%);margin:0 auto;display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,.8fr);align-items:center;gap:clamp(20px,4vw,48px);padding:0 var(--gut) clamp(18px,2.4vw,30px)}
.hello{margin:0;font-family:var(--f-display);font-weight:400;font-size:clamp(40px,min(5.4vw,9.4vh),80px);line-height:1.06;letter-spacing:-.02em}
.hello .ln{display:block}

/* laser etching: text gets burned in by Skeylo's laser */
.ew{position:relative;display:inline-block;white-space:nowrap;--p:-2%}
.ew.run{animation:etch var(--dur,1s) cubic-bezier(.5,0,.35,1) forwards}
.ew.done{--p:104%}
@keyframes etch{from{--p:-2%}to{--p:104%}}
.etch{position:relative;display:inline-block;padding:.16em .12em .22em 0;margin:-.16em -.12em -.22em 0;
  -webkit-mask:linear-gradient(90deg,#000 calc(var(--p) - .6%),transparent calc(var(--p) + .6%));mask:linear-gradient(90deg,#000 calc(var(--p) - .6%),transparent calc(var(--p) + .6%))}
.etch .hot{position:absolute;left:0;top:.16em;color:#fff3e6;-webkit-text-fill-color:#fff3e6;background:none;font-style:inherit;pointer-events:none;
  text-shadow:0 0 8px rgba(255,200,140,.95),0 0 22px rgba(255,130,50,.8);
  -webkit-mask:linear-gradient(90deg,transparent calc(var(--p) - 12%),#000 calc(var(--p) - .5%),transparent calc(var(--p) + .6%));mask:linear-gradient(90deg,transparent calc(var(--p) - 12%),#000 calc(var(--p) - .5%),transparent calc(var(--p) + .6%))}
.ew.done .hot{display:none}
.em{font-style:italic;background:var(--metal);background-size:220% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:metal 7s linear infinite}
@keyframes metal{to{background-position:-220% 0}}
.lh{position:absolute;left:var(--p);top:54%;width:9px;height:9px;margin:-4.5px 0 0 -4.5px;border-radius:50%;background:#fff;opacity:0;pointer-events:none;
  box-shadow:0 0 8px 2px #ffd8b0,0 0 26px 8px rgba(255,138,46,.75),0 0 70px 20px rgba(255,120,40,.3)}
.lh::before{content:"";position:absolute;left:50%;top:50%;width:2px;height:1.15em;transform:translate(-50%,-50%);background:linear-gradient(transparent,rgba(255,236,214,.95),transparent);filter:blur(.4px)}
.ew.run .lh{opacity:1}

/* emblem: Infinity medallion + Skeylo orbit */
.emb{position:relative;justify-self:end;width:clamp(240px,min(34vw,52vh),440px);aspect-ratio:1;margin:-5% 0 -9%;transform-style:preserve-3d;will-change:transform;cursor:pointer;-webkit-tap-highlight-color:transparent}
.emb canvas{position:absolute;inset:-18%;width:136%;height:136%;pointer-events:none}
#ob{z-index:0}#of{z-index:3}
.mark{position:absolute;left:21%;top:21%;width:58%;aspect-ratio:1;z-index:2}
.mark .halo{position:absolute;inset:-28%;border-radius:50%;background:radial-gradient(closest-side,rgba(227,169,174,.30),rgba(184,115,125,.10) 55%,transparent 72%);opacity:0;animation:halo 2s 1.1s var(--ease) forwards,breathe 6s 3.2s ease-in-out infinite}
@keyframes halo{to{opacity:1}}
@keyframes breathe{50%{transform:scale(1.08);opacity:.75}}
.ring{position:absolute;inset:0;width:100%;height:100%;overflow:visible;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:1.6;stroke-linecap:round}
.ring .r1{stroke:url(#rg);stroke-dasharray:302;stroke-dashoffset:302;animation:draw 1.3s .1s cubic-bezier(.65,0,.25,1) forwards;filter:drop-shadow(0 0 2px rgba(251,228,223,.55))}
.ring .r2{stroke:rgba(255,250,246,.95);stroke-width:2.6;stroke-dasharray:2 300;stroke-dashoffset:302;opacity:0;animation:draw 1.3s .1s cubic-bezier(.65,0,.25,1) forwards,fadeTip 1.3s .1s linear forwards;filter:drop-shadow(0 0 6px #fff)}
.ring .r3{stroke:#fff;stroke-width:2.4;opacity:0;filter:drop-shadow(0 0 6px #fff) drop-shadow(0 0 14px rgba(240,138,46,.9))}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes fadeTip{0%{opacity:0}8%{opacity:1}85%{opacity:1}100%{opacity:0}}
.knot{position:absolute;inset:6.25%;--a:0deg;
  -webkit-mask:conic-gradient(from -90deg,#000 var(--a),transparent calc(var(--a) + 18deg));mask:conic-gradient(from -90deg,#000 var(--a),transparent calc(var(--a) + 18deg));
  animation:unveil 1.25s .45s cubic-bezier(.6,0,.2,1) forwards}
@keyframes unveil{to{--a:380deg}}
.knot img{width:100%;height:100%;display:block;filter:drop-shadow(0 10px 30px rgba(0,0,0,.6)) drop-shadow(0 0 22px rgba(227,169,174,.25))}
.sheen{position:absolute;inset:6.25%;pointer-events:none;--sp:-60%;
  -webkit-mask:var(--knot) center/100% 100% no-repeat;mask:var(--knot) center/100% 100% no-repeat;
  background:linear-gradient(110deg,transparent calc(var(--sp) - 14%),rgba(255,247,244,.95) var(--sp),transparent calc(var(--sp) + 14%));mix-blend-mode:screen}
.mark .zp{position:absolute;inset:-14%;border-radius:50%;background:radial-gradient(closest-side,rgba(255,232,220,.6),rgba(240,138,46,.16) 48%,transparent 72%);opacity:0;pointer-events:none;mix-blend-mode:screen}
.mark.zap .sheen{animation:sheen1 1.25s cubic-bezier(.45,0,.2,1)}
.mark.zap .r3{animation:rzap .75s ease-out}
.mark.zap .zp{animation:zp .8s ease-out}
@keyframes sheen1{from{--sp:-60%}to{--sp:160%}}
@keyframes rzap{0%{opacity:1;stroke-width:3.4}100%{opacity:0;stroke-width:1}}
@keyframes zp{0%{opacity:0}15%{opacity:1}100%{opacity:0}}
.emb.hit .mark{animation:slam .6s cubic-bezier(.3,1.6,.5,1)}
@keyframes slam{0%{transform:scale(1)}18%{transform:scale(.88) rotate(-5deg)}45%{transform:scale(1.07) rotate(2deg)}100%{transform:none}}
.sk{position:absolute;left:0;top:0;width:19%;aspect-ratio:1;border-radius:50%;z-index:4;opacity:0;
  background:radial-gradient(circle at 35% 30%,#2a1a12,#0f0906 70%);box-shadow:0 0 0 1.5px rgba(243,176,76,.65),0 10px 30px -6px rgba(0,0,0,.9),0 0 34px -4px rgba(240,138,46,.65);will-change:transform;transition:box-shadow .3s}
.sk i{position:absolute;inset:22%;background:var(--ski) center/contain no-repeat;filter:drop-shadow(0 0 8px rgba(243,160,60,.6))}
.emb:hover .sk{box-shadow:0 0 0 2px rgba(255,190,110,.9),0 10px 30px -6px rgba(0,0,0,.9),0 0 50px 2px rgba(240,138,46,.8)}
.shock{position:absolute;z-index:3;width:30%;aspect-ratio:1;border-radius:50%;border:2px solid rgba(255,236,232,.95);opacity:0;pointer-events:none;transform:translate(-50%,-50%) scale(.2)}
.emb.hit .shock{animation:shock2 .95s cubic-bezier(.1,.7,.3,1) forwards}
.emb.hit .shock.b{animation-delay:.08s;border-width:1px}
.emb.hit .shock.c{animation-delay:.18s;border-color:rgba(240,138,46,.8)}
@keyframes shock2{0%{opacity:1;transform:translate(-50%,-50%) scale(.2)}100%{opacity:0;transform:translate(-50%,-50%) scale(4.6)}}
.emb .bigflash{position:absolute;inset:-30%;z-index:5;border-radius:50%;background:radial-gradient(closest-side,rgba(255,244,240,.95),rgba(255,180,120,.25) 40%,transparent 70%);opacity:0;pointer-events:none;mix-blend-mode:screen}
.emb.hit .bigflash{animation:zp .7s ease-out}

/* ---------- cards ---------- */
.grid{width:min(1120px,100%);margin:0 auto;padding:0 var(--gut) 40px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:clamp(14px,1.8vw,20px)}
.card{--mx:50%;--my:50%;--rx:0deg;--ry:0deg;--dx:0;--dy:0;--gx:0;--gy:0;--tc:251,228,223;--bgi:linear-gradient(160deg,var(--bg-3),var(--bg-2) 60%);
  position:relative;isolation:isolate;display:flex;flex-direction:column;justify-content:flex-end;min-height:clamp(220px,20vw,250px);padding:clamp(22px,2.8vw,32px);
  border-radius:clamp(26px,3vw,34px);text-align:left;overflow:hidden;
  transform:perspective(1200px) rotateX(var(--rx)) rotateY(var(--ry)) scale(var(--sc,1));transition:transform .6s var(--ease),box-shadow .5s;box-shadow:0 30px 70px -40px rgba(0,0,0,.9)}
.card:active{--sc:.985}
.card>.bg{position:absolute;inset:0;z-index:-2;border-radius:inherit;background:var(--bgi)}
.card::before{content:"";position:absolute;inset:0;border-radius:inherit;padding:1px;z-index:5;pointer-events:none;
  background:conic-gradient(from var(--a),rgba(var(--tc),.10) 0 55%,rgba(var(--tc),.85) 68%,rgba(var(--tc),.45) 76%,rgba(var(--tc),.10) 88%);
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask:linear-gradient(#000 0 0) content-box exclude,linear-gradient(#000 0 0);
  opacity:.55;transition:opacity .8s .9s}
.card::after{content:"";position:absolute;inset:0;z-index:2;pointer-events:none;border-radius:inherit;
  background:radial-gradient(520px circle at var(--mx) var(--my),rgba(var(--tc),.13),transparent 45%);opacity:0;transition:opacity .4s}
.card:hover::before,.card:focus-visible::before{opacity:1;transition-delay:0s;animation:spin 3.2s linear infinite}
.card:hover::after{opacity:1}
.card:hover{box-shadow:0 50px 90px -40px rgba(0,0,0,.95),0 0 80px -40px rgba(var(--tc),.5)}
@keyframes spin{to{--a:360deg}}
.art{position:absolute;inset:0;z-index:1;pointer-events:none;transform:translate3d(calc(var(--dx) * -18px),calc(var(--dy) * -12px),0);transition:transform .45s var(--ease)}
.card .t{display:block;position:relative;z-index:4;margin:0;font-family:var(--f-display);font-weight:400;font-size:clamp(30px,3.3vw,42px);line-height:.98;letter-spacing:-.015em;max-width:9em;
  transform:translate3d(calc(var(--dx) * 8px),calc(var(--dy) * 6px),0);transition:transform .45s var(--ease)}
.card .go{position:absolute;z-index:4;right:clamp(20px,2.6vw,30px);bottom:clamp(20px,2.6vw,30px);width:56px;height:56px;border-radius:50%;display:grid;place-items:center;
  background:var(--metal);background-size:200% 100%;color:#2a1218;box-shadow:0 14px 34px -12px rgba(212,145,155,.8);opacity:0;
  transform:translate(calc(var(--gx) * 1px),calc(var(--gy) * 1px)) scale(var(--gs,.8));transition:opacity .35s,transform .45s var(--ease),background-position .8s}
.card .go svg{width:22px;height:22px;transition:transform .45s var(--spring)}
.card:hover .go,.card:focus-visible .go{opacity:1;--gs:1;background-position:100% 0}
.card:hover .go svg{transform:translateX(2px)}
@media (hover:none){.card .go{opacity:1;--gs:.9;width:48px;height:48px}}

/* laser trace around each card on entrance */
.trace{position:absolute;inset:0;width:100%;height:100%;z-index:6;pointer-events:none}
.trace path{fill:none;stroke-dashoffset:var(--L);stroke-linecap:round}
.trace .t1{stroke:rgba(var(--tc),.9);stroke-width:1.6;filter:drop-shadow(0 0 3px rgba(var(--tc),.8))}
.trace .t2{stroke:#fff;stroke-width:3.4;filter:drop-shadow(0 0 4px #fff) drop-shadow(0 0 12px rgba(var(--tc),1))}
.card.on .t1{animation:tdraw 1.15s cubic-bezier(.6,0,.25,1) forwards,tfade 1s 1.4s forwards}
.card.on .t2{animation:tdraw 1.15s cubic-bezier(.6,0,.25,1) forwards,tfade .2s 1.12s forwards}
@keyframes tdraw{from{stroke-dashoffset:var(--L)}to{stroke-dashoffset:0}}
@keyframes tfade{to{opacity:0}}
/* entrance: outline first, then the card ignites */
.rv>.bg{opacity:0}
.rv.on>.bg{animation:ignite 1.1s .5s var(--ease) forwards}
@keyframes ignite{0%{opacity:0;filter:brightness(2.6)}35%{opacity:1}100%{opacity:1;filter:none}}
.rv .art,.rv .t{opacity:0}
.rv.on .art{animation:cin .9s .7s var(--ease) forwards}
.rv.on .t{animation:cin .9s .82s var(--ease) forwards}
.rv:not(.on) .go{visibility:hidden}
.rv:not(.on)::before{opacity:0}
@keyframes cin{from{opacity:0;translate:0 18px;filter:blur(8px)}to{opacity:1;translate:0 0;filter:none}}

/* --- Reporting Dashboard --- */
.rep{grid-column:1/-1;min-height:clamp(250px,21vw,290px);
  --bgi:radial-gradient(120% 90% at 85% 15%,rgba(227,169,174,.20),transparent 55%),radial-gradient(80% 80% at 10% 110%,rgba(184,115,125,.18),transparent 60%),linear-gradient(160deg,#2c1720,#1a0d13 70%)}
.rep .t{font-size:clamp(42px,5.2vw,72px);max-width:none}
.rep .t span{display:block}
.rep .t .em{padding-right:.08em}
.rep .chart{position:absolute;right:-1%;top:4%;width:min(64%,640px);height:auto;overflow:visible}
.rep .gridl line{stroke:rgba(240,190,198,.08);stroke-width:1}
.rep .area{fill:url(#ag);opacity:0;transition:opacity 1.4s 1.6s}
.rep .line{fill:none;stroke:url(#lg);stroke-width:3;stroke-linecap:round;stroke-linejoin:round;filter:drop-shadow(0 0 8px rgba(227,169,174,.6));stroke-dasharray:var(--len,1400);stroke-dashoffset:var(--len,1400);transition:stroke-dashoffset 2.2s cubic-bezier(.65,0,.25,1) .9s}
.rep.on .line{stroke-dashoffset:0}
.rep.on .area{opacity:1}
.rep .bars rect{fill:rgba(240,190,198,.09);transform-box:fill-box;transform-origin:bottom;transform:scaleY(0);transition:transform 1.1s var(--spring)}
.rep.on .bars rect{transform:none}
.rep .orb{fill:#fff6f3;filter:drop-shadow(0 0 10px #f5c9cd) drop-shadow(0 0 22px rgba(227,169,174,.9));opacity:0;transition:opacity .6s}
.rep .orbring{fill:none;stroke:rgba(251,228,223,.7);stroke-width:1.5;opacity:0;transition:opacity .6s}
.rep.live .orb,.rep.live .orbring{opacity:1}
.rep .xh{opacity:0;transition:opacity .25s}
.rep .xh line{stroke:rgba(251,228,223,.55);stroke-width:1.5;stroke-dasharray:3 6}
.rep .xh .xd{fill:#fff;filter:drop-shadow(0 0 8px #fff) drop-shadow(0 0 18px rgba(227,169,174,1))}
.rep .xh .xr{fill:none;stroke:rgba(251,228,223,.8);stroke-width:1.5}
.rep.xon .xh{opacity:1}
.rep.xon .orb,.rep.xon .orbring{opacity:0}
.rep .halo2{position:absolute;right:8%;top:-30%;width:60%;aspect-ratio:1;border-radius:50%;border:1px solid rgba(240,190,198,.10);pointer-events:none}
.rep .halo2.b{right:-6%;top:-12%;width:44%;border-color:rgba(240,190,198,.07)}
.rep:hover .line{filter:drop-shadow(0 0 14px rgba(251,228,223,.85))}
.rep .go{width:66px;height:66px}
.rep .go svg{width:26px;height:26px}

/* --- Creative Inspection --- */
.ci .ciw{position:absolute;right:clamp(22px,4vw,44px);top:clamp(22px,3.4vw,36px);width:min(42%,210px);height:calc(100% - clamp(118px,10vw,128px))}
.ci .sheet{position:absolute;inset:0;border-radius:18px;background:linear-gradient(170deg,#2f1a23,#22121a);border:1px solid var(--line);box-shadow:0 24px 50px -24px #000;padding:18px 16px;display:grid;align-content:start;gap:9px;overflow:hidden;transform:rotate(4deg);transition:transform .7s var(--spring)}
.ci .sheet::after{content:"";position:absolute;left:0;right:0;top:0;height:2px;background:linear-gradient(90deg,transparent,#fff 30%,#fff 70%,transparent);box-shadow:0 0 12px 2px rgba(251,228,223,.75),0 0 30px 6px rgba(227,169,174,.35);animation:scanv 3.4s cubic-bezier(.6,0,.4,1) infinite}
@keyframes scanv{0%{transform:translateY(-6px);opacity:0}8%{opacity:1}55%{opacity:1}62%{transform:translateY(var(--sh,180px));opacity:0}100%{transform:translateY(var(--sh,180px));opacity:0}}
.card:hover .sheet{transform:rotate(0) translateY(-6px)}
.ci .sheet>i{display:block;height:7px;border-radius:4px;background:rgba(240,190,198,.14)}
.ci .sheet>i.h{height:10px;width:60%;background:rgba(251,228,223,.4);margin-bottom:4px}
.ci .sheet>i:nth-child(3){width:88%}.ci .sheet>i:nth-child(4){width:94%}.ci .sheet>i:nth-child(5){width:70%}.ci .sheet>i:nth-child(6){width:82%}
.ci .stat{position:absolute;right:-14px;bottom:-14px;display:flex;align-items:center;gap:8px;padding:8px 14px 8px 10px;border-radius:999px;background:var(--metal);background-size:200% 100%;color:#2a1218;font-size:14px;font-weight:600;box-shadow:0 14px 30px -12px rgba(212,145,155,.8);white-space:nowrap;transform:rotate(-3deg);z-index:2;perspective:220px}
.ci .stat b{width:20px;height:20px;border-radius:50%;background:#2a1218;display:grid;place-items:center}
.ci .stat b::after{content:"";width:6px;height:6px;border-radius:50%;background:var(--rose-1);animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.7);opacity:.5}}
.ci .stat span{display:inline-block;transform-origin:50% 50%;backface-visibility:hidden}
.ci .stat span.fo{animation:flipo .2s ease-in forwards}
.ci .stat span.fi{animation:flipi .38s var(--spring)}
@keyframes flipo{to{transform:rotateX(90deg);opacity:.3}}
@keyframes flipi{from{transform:rotateX(-90deg);opacity:.3}}
.ci .dots{position:absolute;right:16px;top:20px;display:flex;gap:5px}
.ci .dots i{width:7px;height:7px;border-radius:50%;background:rgba(240,190,198,.2);transition:background .4s,transform .4s var(--spring)}
.ci .dots i.on{background:var(--rose-2);transform:scale(1.3)}

/* --- Creatives --- */
.cr .fan{position:absolute;right:clamp(28px,6vw,70px);top:clamp(24px,3.4vw,36px);width:min(44%,210px);height:calc(100% - clamp(112px,9.6vw,124px))}
.cr .ph{position:absolute;left:50%;top:0;height:100%;aspect-ratio:9/16;translate:-50% 0;border-radius:14px;border:1px solid rgba(240,190,198,.22);overflow:hidden;transform-origin:50% 120%;transition:transform .7s var(--spring);box-shadow:0 20px 40px -20px #000}
.cr .ph::after{content:"";position:absolute;inset:0;background:linear-gradient(115deg,transparent 30%,rgba(255,240,236,.18) 45%,transparent 60%);transform:translateX(-120%);animation:glint 4.5s ease-in-out infinite}
.cr .ph:nth-child(1){background:linear-gradient(170deg,#5a2f3b,#2a141c);transform:rotate(-16deg) translateX(-10%)}
.cr .ph:nth-child(2){background:linear-gradient(170deg,#7d4552,#331a22);transform:rotate(14deg) translateX(10%)}
.cr .ph:nth-child(3){background:#2a141c;z-index:2}
.cr .ph:nth-child(1)::after{animation-delay:.6s}.cr .ph:nth-child(2)::after{animation-delay:1.2s}
@keyframes glint{0%,55%{transform:translateX(-120%)}80%,100%{transform:translateX(120%)}}
.cr .vid{position:absolute;inset:0;overflow:hidden}
.cr .vid b{position:absolute;width:95%;aspect-ratio:1;border-radius:50%;filter:blur(14px);opacity:.85}
.cr .vid b:nth-child(1){background:#e9a8b0;left:-35%;top:-12%;animation:bl1 5.5s ease-in-out infinite alternate}
.cr .vid b:nth-child(2){background:#8a3f52;right:-45%;bottom:-18%;animation:bl2 6.5s ease-in-out infinite alternate}
.cr .vid b:nth-child(3){background:#f6d3cf;width:45%;left:30%;top:40%;opacity:.5;animation:bl1 4.2s ease-in-out infinite alternate-reverse}
@keyframes bl1{to{transform:translate(55%,45%) scale(1.2)}}
@keyframes bl2{to{transform:translate(-50%,-55%) scale(.85)}}
.card:hover .ph:nth-child(1){transform:rotate(-26deg) translateX(-30%)}
.card:hover .ph:nth-child(2){transform:rotate(24deg) translateX(30%)}
.card:hover .ph:nth-child(3){transform:translateY(-8px) scale(1.04)}
.cr .play{position:absolute;left:50%;top:44%;width:38px;height:38px;margin:-19px 0 0 -19px;border-radius:50%;background:rgba(20,10,14,.5);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);display:grid;place-items:center;border:1px solid rgba(251,228,223,.45);z-index:2}
.cr .play::before{content:"";position:absolute;inset:-1px;border-radius:50%;border:1px solid rgba(251,228,223,.7);animation:ring 2.2s ease-out infinite}
.cr .play::after{content:"";margin-left:3px;border-left:11px solid var(--rose-1);border-top:7px solid transparent;border-bottom:7px solid transparent}
@keyframes ring{from{transform:scale(1);opacity:1}to{transform:scale(1.9);opacity:0}}
.cr .ph .bar{position:absolute;left:10%;right:10%;bottom:9%;height:3px;border-radius:2px;background:rgba(255,255,255,.18);overflow:hidden;z-index:2}
.cr .ph .bar::after{content:"";position:absolute;inset:0;background:var(--rose-1);transform-origin:left;animation:prog 5s linear infinite}
@keyframes prog{from{transform:scaleX(0)}to{transform:scaleX(1)}}

/* --- Organisation --- */
.org .cal{position:absolute;right:clamp(20px,4vw,44px);top:clamp(22px,3vw,32px);width:min(40%,180px);padding:12px;border-radius:20px;background:linear-gradient(170deg,#2c1820,#1f1118);border:1px solid var(--line);box-shadow:0 24px 50px -24px #000;transform:rotate(-3deg);transition:transform .7s var(--spring)}
.card:hover .cal{transform:rotate(0) translateY(-6px)}
.org .cal .hd{height:9px;width:46%;border-radius:5px;background:rgba(251,228,223,.4);margin:2px 0 11px}
.org .cal .gd{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.org .cal .gd i{position:relative;aspect-ratio:1;border-radius:6px;background-color:rgba(240,190,198,.08);transition:box-shadow .4s,transform .4s var(--spring)}
.org .cal .gd i.ev{background-color:rgba(240,190,198,.22)}
.org .cal .gd i.on{background-image:var(--metal);box-shadow:0 0 16px rgba(227,169,174,.7);transform:scale(1.14)}
.org .cal .gd i.on::after{content:"";position:absolute;inset:-3px;border-radius:8px;border:1.5px solid var(--rose-1);animation:ping 1.2s ease-out forwards}
@keyframes ping{from{transform:scale(1);opacity:1}to{transform:scale(2.2);opacity:0}}
.org .pin{position:absolute;right:calc(clamp(20px,4vw,44px) - 12px);top:calc(clamp(22px,3vw,32px) - 14px);width:44px;height:44px;border-radius:50%;background:var(--bg);border:1.5px solid rgba(251,228,223,.6);display:grid;place-items:center;box-shadow:0 10px 24px -8px #000;z-index:2}
.org .pin svg{width:44px;height:44px}
.org .pin .hh{transform-origin:22px 22px;animation:clock 12s linear infinite}
.org .pin .mh{transform-origin:22px 22px;animation:clock 2s linear infinite}
@keyframes clock{to{transform:rotate(360deg)}}

/* --- General --- */
.gen .docs{position:absolute;right:clamp(34px,5vw,60px);top:clamp(22px,3vw,32px);width:min(32%,140px);aspect-ratio:3/3.4}
.gen .doc{position:absolute;inset:0;border-radius:16px;background:linear-gradient(170deg,#301b24,#21121a);border:1px solid var(--line);box-shadow:0 20px 40px -22px #000;padding:16px 14px;display:grid;align-content:start;gap:8px;transition:transform .7s var(--spring)}
.gen .doc::before{content:"";position:absolute;right:-1px;top:-1px;width:26px;height:26px;border-radius:0 16px 0 10px;background:linear-gradient(225deg,var(--bg-2) 50%,rgba(240,190,198,.25) 50%)}
.gen .doc i{display:block;height:6px;border-radius:3px;background:rgba(240,190,198,.13)}
.gen .doc i.h{width:55%;height:9px;background:rgba(251,228,223,.38);margin-bottom:3px}
.gen .doc:nth-child(1){transform:rotate(-10deg) translate(-14%,6%)}
.gen .doc:nth-child(2){transform:rotate(7deg) translate(10%,4%)}
.gen .doc.dtop{z-index:2;animation:bump 5.2s var(--ease) infinite}
@keyframes bump{0%,30%{translate:0 0}34%{translate:0 7px}42%,100%{translate:0 0}}
.gen .doc .chart2{display:flex;align-items:flex-end;gap:5px;height:40px;margin-top:6px}
.gen .doc .chart2 b{flex:1;border-radius:3px 3px 0 0;background:var(--metal);background-size:300% 100%;transform-origin:bottom;animation:grow 3.6s var(--ease) infinite}
.gen .chart2 b:nth-child(1){height:40%}.gen .chart2 b:nth-child(2){height:62%;animation-delay:.15s}.gen .chart2 b:nth-child(3){height:52%;animation-delay:.3s}.gen .chart2 b:nth-child(4){height:88%;animation-delay:.45s}
@keyframes grow{0%{transform:scaleY(.15)}30%,80%{transform:none}100%{transform:scaleY(.15)}}
.gen .doc.fly{z-index:3;background:linear-gradient(170deg,#4a2a35,#2c1720);border-color:rgba(251,228,223,.4);animation:fly 5.2s cubic-bezier(.6,0,.2,1) infinite}
.gen .doc.fly::after{content:"";position:absolute;right:100%;top:40%;width:120%;height:2px;background:linear-gradient(90deg,transparent,rgba(240,138,46,.9));box-shadow:0 0 12px rgba(240,138,46,.8);opacity:0;animation:flytrail 5.2s cubic-bezier(.6,0,.2,1) infinite}
@keyframes fly{0%{transform:translate(-260%,-60%) rotate(-30deg) scale(.55);opacity:0}8%{opacity:1}30%{transform:translate(0,0) rotate(0) scale(1);opacity:1;box-shadow:0 0 0 1px rgba(251,228,223,.6),0 0 40px rgba(251,228,223,.6)}38%{opacity:1;box-shadow:0 0 0 1px rgba(251,228,223,0),0 0 0 rgba(0,0,0,0)}46%,100%{transform:translate(0,0) scale(1);opacity:0}}
@keyframes flytrail{0%,6%{opacity:0}12%,26%{opacity:1}30%,100%{opacity:0}}
.card:hover .doc:nth-child(1){transform:rotate(-16deg) translate(-26%,4%)}
.card:hover .doc:nth-child(2){transform:rotate(13deg) translate(22%,2%)}

/* --- Privacy (grey, mysterious) --- */
.priv{grid-column:1/-1;min-height:clamp(200px,18vw,230px);--tc:232,232,238;--mx:80%;
  --bgi:radial-gradient(80% 120% at 85% 50%,rgba(200,196,198,.10),transparent 60%),linear-gradient(160deg,#1d1a1c,#121012 70%)}
.priv .t{background:linear-gradient(115deg,#f2f2f4,#a9a6aa 45%,#e4e3e6 70%,#8d8a8e);background-size:220% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:metal 9s linear infinite}
.priv.rv.on .t{animation:cin .9s .82s var(--ease) forwards,metal 9s linear infinite}
.priv .fog{position:absolute;inset:-20%;z-index:0;pointer-events:none;opacity:.55;
  background:radial-gradient(30% 40% at 30% 60%,rgba(190,188,192,.10),transparent 70%),radial-gradient(35% 45% at 70% 40%,rgba(190,188,192,.08),transparent 70%);animation:fog 14s ease-in-out infinite alternate}
@keyframes fog{to{transform:translate(8%,-6%) scale(1.15)}}
.priv .lockw{position:absolute;right:clamp(40px,9vw,120px);top:50%;width:clamp(84px,9vw,112px);transform:translateY(-54%);z-index:1}
.priv .lock{display:block;width:100%;filter:drop-shadow(0 22px 34px rgba(0,0,0,.8))}
.priv .lock .sh{transform-origin:70px 64px;transition:transform .6s var(--spring)}
.priv .lock .kh{transition:fill .4s,filter .4s}
.card.priv:hover .lock{animation:rattle .5s ease-in-out}
.card.priv:hover .lock .kh{fill:#e9e7ea;filter:drop-shadow(0 0 6px #fff)}
@keyframes rattle{20%{transform:rotate(-5deg)}45%{transform:rotate(4deg)}70%{transform:rotate(-2deg)}}
.priv.open .lock .sh{transform:translateY(-16px) rotate(-16deg)}
.priv .scan{position:absolute;left:-14%;right:-14%;top:38%;height:2px;border-radius:2px;background:linear-gradient(90deg,transparent,#fff 25%,#fff 75%,transparent);box-shadow:0 0 12px 2px rgba(240,240,246,.8),0 0 30px 8px rgba(200,200,210,.3);opacity:0}
.card.priv:hover .scan{animation:pscan 1.5s cubic-bezier(.6,0,.4,1) infinite}
@keyframes pscan{0%{top:38%;opacity:0}10%{opacity:1}50%{top:98%;opacity:1}60%{opacity:0}100%{top:38%;opacity:0}}
.priv .go{background:linear-gradient(115deg,#f2f2f4,#a9a6aa 45%,#e4e3e6 70%,#8d8a8e);background-size:200% 100%;color:#151315;box-shadow:0 14px 34px -12px rgba(0,0,0,.9)}
.priv .dots{position:absolute;left:clamp(22px,2.8vw,32px);top:clamp(22px,2.8vw,32px);display:flex;gap:10px;z-index:4}
.priv .dots i{width:11px;height:11px;border-radius:50%;background:rgba(220,218,222,.25);animation:blink 2.8s ease-in-out infinite}
.priv .dots i:nth-child(2){animation-delay:.2s}.priv .dots i:nth-child(3){animation-delay:.4s}.priv .dots i:nth-child(4){animation-delay:.6s}.priv .dots i:nth-child(5){animation-delay:.8s}
@keyframes blink{0%,60%,100%{background:rgba(220,218,222,.25)}30%{background:rgba(240,240,244,.85)}}

/* ---------- footer ---------- */
.foot{position:relative;z-index:2;display:grid;place-items:center;padding:48px 20px calc(56px + env(safe-area-inset-bottom,0px))}
.foot .wm{width:120px;aspect-ratio:520/177;background:var(--wm) center/contain no-repeat;opacity:.7}

/* ---------- page takeover ---------- */
.cut{position:fixed;left:0;right:0;top:50%;height:2px;margin-top:-1px;z-index:55;pointer-events:none;opacity:0;--cx:50vw;
  background:linear-gradient(90deg,transparent,rgba(255,232,224,.95) 12%,#fff 50%,rgba(255,232,224,.95) 88%,transparent);
  box-shadow:0 0 14px 2px rgba(255,214,206,.9),0 0 46px 8px rgba(227,169,174,.55)}
.cut.go{animation:cutgo .75s cubic-bezier(.3,.8,.2,1) forwards}
@keyframes cutgo{0%{opacity:1;clip-path:inset(0 calc(100vw - var(--cx)) 0 var(--cx))}45%{opacity:1;clip-path:inset(0 0 0 0)}100%{opacity:0;clip-path:inset(0 0 0 0)}}
.take{position:fixed;z-index:50;left:0;top:0;width:100%;height:100%;pointer-events:none;visibility:hidden}
.take .pane{position:fixed;overflow:hidden;background:var(--bg-2);will-change:left,top,width,height}
.take.on{visibility:visible;pointer-events:auto}
.take .in{position:absolute;inset:0;display:grid;place-items:center;align-content:center;gap:22px;padding:30px var(--gut);text-align:center;opacity:0;transition:opacity .4s .1s}
.take.full .in{opacity:1}
.take h2{margin:0;font-family:var(--f-display);font-weight:400;font-size:clamp(40px,8vw,112px);line-height:1.05;letter-spacing:-.02em}
.take.grey h2 .em{background-image:linear-gradient(115deg,#f2f2f4,#a9a6aa 45%,#e4e3e6 70%,#8d8a8e)}
.take p{margin:0;color:var(--muted);font-size:18px}
.take .back{display:inline-flex;align-items:center;gap:10px;margin-top:10px;padding:14px 22px 14px 16px;border-radius:999px;border:1px solid var(--line);background:rgba(255,255,255,.03);font-weight:500;transition:background .25s,transform .4s var(--spring)}
.take .back:hover{background:rgba(240,190,198,.08);transform:translateX(-4px)}
.take .back svg{width:20px;height:20px}
.take.grey .back:focus-visible{outline-color:#c9c7ca}
.take .tw{position:absolute;left:50%;top:50%;width:min(84vmin,720px);aspect-ratio:1;translate:-50% -50%;opacity:0;pointer-events:none;
  background:var(--metal);-webkit-mask:var(--knot) center/contain no-repeat;mask:var(--knot) center/contain no-repeat;transition:opacity 1.6s .25s;animation:tspin 120s linear infinite}
.take .tr{position:absolute;left:50%;top:50%;width:min(112vmin,1000px);aspect-ratio:1;translate:-50% -50%;border-radius:50%;border:1px solid rgba(240,190,198,.09);opacity:0;transform:scale(.55);pointer-events:none;transition:opacity 1.2s .15s,transform 1.8s .1s var(--ease)}
.take .tr.b{width:min(70vmin,620px);border-color:rgba(240,190,198,.07);transition-delay:.25s}
.take.full .tw{opacity:.06}
.take.full .tr{opacity:1;transform:none}
.take.grey .tw{background:linear-gradient(115deg,#f2f2f4,#a9a6aa 45%,#e4e3e6 70%,#8d8a8e)}
.take.grey .tr{border-color:rgba(230,230,236,.08)}
.take.grey p{color:#a9a6aa}
@keyframes tspin{to{rotate:360deg}}

/* ---------- privacy vault ---------- */
.vault{position:fixed;inset:0;z-index:60;display:grid;place-items:center;padding:20px;background:rgba(8,7,8,.72);backdrop-filter:blur(18px) saturate(.4);-webkit-backdrop-filter:blur(18px) saturate(.4);opacity:0;transition:opacity .35s}
.vault[hidden]{display:none}
.vault.on{opacity:1}
.vbox{position:relative;width:min(420px,100%);display:grid;justify-items:center;gap:22px;padding:40px 28px 30px;border-radius:32px;background:linear-gradient(170deg,#211e20,#151315);border:1px solid rgba(220,218,222,.12);box-shadow:0 50px 100px -30px #000;transform:translateY(30px) scale(.94);transition:transform .6s var(--spring);text-align:center;overflow:hidden}
.vault.on .vbox{transform:none}
.vbox::after{content:"";position:absolute;left:0;right:0;top:-4px;height:2px;background:linear-gradient(90deg,transparent,#fff 20%,#fff 80%,transparent);box-shadow:0 0 16px 3px rgba(240,240,246,.9);opacity:0}
.vbox.ok::after{animation:vscan .7s cubic-bezier(.6,0,.4,1) forwards}
@keyframes vscan{0%{top:-4px;opacity:1}100%{top:100%;opacity:1}}
.vbox .vl{width:84px}
.vbox .vl .sh{transform-origin:70px 64px;transition:transform .6s var(--spring)}
.vbox.ok .vl .sh{transform:translateY(-16px) rotate(-16deg)}
.vbox h3{margin:0;font-family:var(--f-display);font-weight:400;font-size:34px;line-height:1.05;color:#ecebee}
.vin{position:relative;width:100%}
.vin input{width:100%;height:60px;border-radius:18px;border:1px solid rgba(220,218,222,.16);background:#0e0d0e;color:#f2f2f4;text-align:center;font-size:22px;letter-spacing:.35em;outline:none;transition:border-color .25s,box-shadow .3s}
.vin input:focus{border-color:rgba(235,235,240,.5);box-shadow:0 0 0 4px rgba(235,235,240,.08)}
.vbox .err{min-height:22px;margin:-8px 0 -6px;color:#ff8b7e;font-size:15px}
.vbox.bad{animation:shake .45s}
@keyframes shake{20%{transform:translateX(-10px)}40%{transform:translateX(9px)}60%{transform:translateX(-6px)}80%{transform:translateX(4px)}}
.vbtns{display:flex;gap:10px;width:100%}
.vbtns button{flex:1;height:54px;border-radius:16px;font-weight:600;font-size:16px;border:1px solid rgba(220,218,222,.14);transition:filter .2s,transform .3s var(--spring)}
.vbtns .ok{background:linear-gradient(115deg,#f2f2f4,#b9b6ba 50%,#e4e3e6);color:#151315;border:0}
.vbtns button:active{transform:scale(.97)}

/* =========================================================
   REPORTING DASHBOARD
   periodi (aktuelni mesec najveći) → Loom / Pisani → lista (najnoviji gore)
   ========================================================= */
.page.away{position:fixed;left:0;right:0;top:0;height:100vh;overflow:hidden;visibility:hidden;pointer-events:none}
.fadeout{opacity:0;transition:opacity .17s ease}
.fadein{animation:fadeIn .4s ease}
html.noscroll{overflow:hidden}
.take.bare .in,.take.bare .tw,.take.bare .tr{display:none}
@media (hover:none){.grain{display:none}}

.rapp{position:relative;z-index:2;min-height:100vh;padding-bottom:calc(72px + env(safe-area-inset-bottom,0px));overflow-x:clip}
.rtop{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:rgba(20,10,14,0);box-shadow:0 1px 0 transparent;transition:background .35s,box-shadow .35s}
.rtop.scrolled{background:rgba(20,10,14,.82);-webkit-backdrop-filter:blur(16px) saturate(1.2);backdrop-filter:blur(16px) saturate(1.2);box-shadow:0 1px 0 var(--line),0 20px 40px -30px rgba(0,0,0,.9)}
.rtop-in{width:min(1120px,100%);margin:0 auto;display:flex;align-items:center;flex-wrap:wrap;gap:12px 16px;padding:14px var(--gut)}
.rback{order:1;display:inline-flex;align-items:center;gap:10px;height:46px;padding:0 18px 0 6px;border-radius:999px;border:1px solid var(--line);background:rgba(255,255,255,.03);font-weight:500;font-size:15px;white-space:nowrap;transition:background .25s,border-color .25s}
.rback .ic{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--metal);background-size:200% 100%;color:#2a1218;transition:transform .45s var(--spring)}
.rback .ic svg{width:18px;height:18px}
.rback:hover{background:rgba(240,190,198,.07);border-color:rgba(240,190,198,.28)}
.rback:hover .ic{transform:translateX(-3px)}
.rsp{order:3;flex:1}
.rwmk{order:5;display:block;height:26px;aspect-ratio:520/177;background:var(--wm) center/contain no-repeat}

/* sticky switch: Loom ↔ Pisani */
.rsw{order:2;position:relative;display:inline-grid;grid-template-columns:1fr 1fr;padding:5px;border-radius:999px;background:rgba(255,255,255,.035);border:1px solid var(--line);isolation:isolate}
.rsw .ind{position:absolute;z-index:0;top:5px;bottom:5px;left:5px;width:calc(50% - 5px);border-radius:999px;background:var(--metal);background-size:200% 100%;box-shadow:0 10px 26px -10px rgba(212,145,155,.85);transition:transform .6s var(--spring),background-position .9s}
.rsw[data-on="pisani"] .ind{transform:translateX(100%);background-position:100% 0}
.rsw button{position:relative;z-index:1;display:inline-flex;align-items:center;justify-content:center;gap:9px;height:44px;padding:0 22px;border-radius:999px;font-size:15px;font-weight:500;color:var(--muted);white-space:nowrap;transition:color .35s}
.rsw button:hover{color:var(--cream)}
.rsw button[aria-selected="true"]{color:#2a1218}
.rsw button svg{width:16px;height:16px;flex:none}

.rmain{width:min(1120px,100%);margin:0 auto;padding:6px var(--gut) 0}
.rhead{margin:26px 0 34px}
.rh1{margin:0;font-family:var(--f-display);font-weight:400;font-size:clamp(46px,6.6vw,96px);line-height:1.02;letter-spacing:-.02em;outline:none}
.rh1 .ln{display:block}
.etch .hot i{font-style:italic}
.pill{display:inline-flex;align-items:center;justify-content:center;gap:9px;height:48px;padding:0 20px;border-radius:999px;border:1px solid rgba(240,190,198,.22);background:rgba(255,255,255,.03);color:var(--cream);font-weight:500;font-size:15px;text-decoration:none;white-space:nowrap;transition:background .25s,border-color .25s,transform .4s var(--spring)}
.pill:hover{background:rgba(240,190,198,.08);border-color:rgba(240,190,198,.4)}
.pill svg{width:17px;height:17px;flex:none}
.pill.solid{background:var(--metal);background-size:200% 100%;color:#2a1218;border:0;font-weight:600;box-shadow:0 14px 34px -14px rgba(212,145,155,.85);transition:background-position .8s,transform .4s var(--spring)}
.pill.solid:hover{background-position:100% 0;transform:translateY(-2px)}
